<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .fbb-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .fbb-tool {
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .fbb-paint-wash {
      fill: rgba(37, 99, 235, 0.16);
      transform-origin: 2.3px 4.25px;
      transform: scaleX(0);
      opacity: 0;
      transition:
        transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.2s ease;
    }
    .fbb-cylinder {
      stroke: #374151;
      stroke-width: 1.35;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }
    .fbb-arm {
      stroke: #374151;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }
    .fbb-handle {
      fill: rgba(55, 65, 81, 0.08);
      stroke: #374151;
      stroke-width: 1.35;
      stroke-linejoin: round;
      transition: stroke 0.2s ease, fill 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .fbb-tool { transform: translateY(-0.65px); }
    svg:hover .fbb-cylinder { stroke: #2563eb; }
    svg:hover .fbb-paint-wash {
      transform: scaleX(1);
      opacity: 1;
    }
    svg:hover .fbb-arm,
    svg:hover .fbb-handle { stroke: #111827; }
    svg:hover .fbb-handle { fill: rgba(17, 24, 39, 0.09); }
    svg:active .fbb-root { transform: scale(0.91); }
    svg:active .fbb-tool { transform: translateY(0.25px); }
  </style>

  <defs>
    <clipPath id="fbb-roller-clip">
      <rect x="2.3" y="2.4" width="8.9" height="3.7" rx="1.1" />
    </clipPath>
  </defs>

  <g class="fbb-root">
    <g class="fbb-tool">
      <!-- 滚筒内部从左至右扫入的吸色蓝底 -->
      <g clip-path="url(#fbb-roller-clip)">
        <rect class="fbb-paint-wash" x="2.3" y="2.4" width="8.9" height="3.7" />
      </g>
      <!-- 顶部滚筒主体 -->
      <rect class="fbb-cylinder" x="2.3" y="2.4" width="8.9" height="3.7" rx="1.1" />
      <!-- 右侧折角连接支架 -->
      <path class="fbb-arm" d="M11.2 4.25 H12.55 A0.85 0.85 0 0 1 13.4 5.1 V7.35 A0.85 0.85 0 0 1 12.55 8.2 H8.15 A0.85 0.85 0 0 0 7.3 9.05 V9.7" />
      <!-- 下部垂直握柄 -->
      <rect class="fbb-handle" x="6.1" y="9.7" width="2.4" height="4" rx="0.95" />
    </g>
  </g>
</svg>
