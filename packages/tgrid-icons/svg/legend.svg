<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .legend-root {
      transform-origin: 8px 8px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .swatch {
      stroke: #374151;
      stroke-width: 2;
      stroke-linecap: round;
      transform-origin: 2.4px 8px;
      transition: stroke 0.22s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .s1 { transform-origin: 2.4px 3.5px; transition-delay: 0ms; }
    .s2 { transform-origin: 2.4px 8px;   transition-delay: 40ms; }
    .s3 { transform-origin: 2.4px 12.5px; transition-delay: 80ms; }

    .label-line {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      transition: stroke 0.2s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .l1 { transition-delay: 0ms; }
    .l2 { transition-delay: 40ms; }
    .l3 { transition-delay: 80ms; }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .s1 { stroke: #1d4ed8; transform: scaleX(1.18); }
    svg:hover .s2 { stroke: #3b82f6; transform: scaleX(1.18); }
    svg:hover .s3 { stroke: #60a5fa; transform: scaleX(1.18); }
    svg:hover .label-line { stroke: #111827; transform: translateX(0.65px); }
    svg:active .legend-root { transform: scale(0.91); }
  </style>

  <g class="legend-root">
    <!-- 行 1 -->
    <path class="swatch s1" d="M2.4 3.5 H4.4" />
    <path class="label-line l1" d="M7.2 3.5 H13.8" />
    <!-- 行 2 -->
    <path class="swatch s2" d="M2.4 8 H4.4" />
    <path class="label-line l2" d="M7.2 8 H12.2" />
    <!-- 行 3 -->
    <path class="swatch s3" d="M2.4 12.5 H4.4" />
    <path class="label-line l3" d="M7.2 12.5 H13.4" />
  </g>
</svg>