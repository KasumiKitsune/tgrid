<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .gear-press {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .gear-spin {
      transform-origin: 8px 8px;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .gear-outer {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }
    .gear-core {
      stroke: #374151;
      stroke-width: 1.45;
      transition: stroke 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .gear-spin { transform: rotate(60deg); }
    svg:hover .gear-outer { stroke: #111827; }
    svg:hover .gear-core { stroke: #2563eb; }
    svg:active .gear-press { transform: scale(0.9); }
  </style>

  <g class="gear-press">
    <g class="gear-spin">
      <path class="gear-outer" d="M6.43 3.68 L6.82 1.91 L9.18 1.91 L9.57 3.68 L10.96 4.48 L12.68 3.93 L13.86 5.98 L12.53 7.20 L12.53 8.80 L13.86 10.02 L12.68 12.07 L10.96 11.52 L9.57 12.32 L9.18 14.09 L6.82 14.09 L6.43 12.32 L5.04 11.52 L3.32 12.07 L2.14 10.02 L3.47 8.80 L3.47 7.20 L2.14 5.98 L3.32 3.93 L5.04 4.48 Z" />
      <circle class="gear-core" cx="8" cy="8" r="2.1" />
    </g>
  </g>
</svg>