<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .tl-root {
      transform-origin: 8px 8px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tl-tip, .tl-grip {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    .tl-wrench {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: rgba(37, 99, 235, 0);
      transform-origin: 8px 8px;
      transition:
        transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
        stroke 0.2s ease,
        fill 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .tl-tip {
      stroke: #111827;
      transform: translate(-0.25px, -0.25px);
    }
    svg:hover .tl-grip {
      stroke: #111827;
      transform: translate(0.25px, 0.25px);
    }
    svg:hover .tl-wrench {
      stroke: #2563eb;
      fill: rgba(37, 99, 235, 0.12);
      transform: rotate(-7deg);
    }
    svg:active .tl-root { transform: scale(0.91); }
  </style>

  <g class="tl-root">
    <!-- 后层：一字改锥（沿交汇处留出对称光学断口） -->
    <g class="tl-tip">
      <path d="M2.35 3.05 L3.05 2.35" />
      <path d="M2.7 2.7 L5.35 5.35" />
    </g>
    <path class="tl-grip" d="M10.15 11.4 L11.4 10.15 L13.6 12.35 A0.88 0.88 0 0 1 12.35 13.6 Z" />

    <!-- 前层：精密开口扳手 -->
    <path class="tl-wrench" d="M12.01 2.37 L10.3 4.08 L11.92 5.7 L13.63 3.99 A2.95 2.95 0 0 1 9.72 7.8 L4.31 13.21 A1.08 1.08 0 0 1 2.79 11.69 L8.2 6.28 A2.95 2.95 0 0 1 12.01 2.37 Z" />
  </g>
</svg>
