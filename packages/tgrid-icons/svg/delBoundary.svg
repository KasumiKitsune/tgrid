<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .db-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .half {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    .stub {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linecap: round;
      transition: opacity 0.22s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cross {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linecap: round;
      transform-origin: 8px 8px;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .half { stroke: #111827; }
    svg:hover .half-l { transform: translateX(0.65px); }
    svg:hover .half-r { transform: translateX(-0.65px); }
    svg:hover .stub-t { opacity: 0.28; transform: translateY(-0.55px); }
    svg:hover .stub-b { opacity: 0.28; transform: translateY(0.55px); }
    svg:hover .cross { stroke: #dc2626; transform: rotate(90deg) scale(1.06); }
    svg:active .db-root { transform: scale(0.91); }
  </style>

  <g class="db-root">
    <!-- 左邻段 -->
    <path class="half half-l" d="M4.3 4.3 H3.3 C2.69 4.3 2.2 4.79 2.2 5.4 V10.6 C2.2 11.21 2.69 11.7 3.3 11.7 H4.3" />
    <!-- 右邻段 -->
    <path class="half half-r" d="M11.7 4.3 H12.7 C13.31 4.3 13.8 4.79 13.8 5.4 V10.6 C13.8 11.21 13.31 11.7 12.7 11.7 H11.7" />
    <!-- 待删边界上下端头 -->
    <path class="stub stub-t" d="M8 2 V4.3" />
    <path class="stub stub-b" d="M8 11.7 V14" />
    <!-- 中央删除叉号 -->
    <g class="cross">
      <path d="M6.2 6.2 L9.8 9.8" />
      <path d="M9.8 6.2 L6.2 9.8" />
    </g>
  </g>
</svg>
