<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .ml-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .slot {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }
    .arrow {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .slot { stroke: #111827; }
    svg:hover .arrow {
      stroke: #2563eb;
      transform: translateX(-1.1px);
    }
    svg:active .ml-root { transform: scale(0.91); }
  </style>

  <g class="ml-root">
    <!-- 左侧承接区间槽 -->
    <path class="slot" d="M6.4 3.4 H3.7 C2.87 3.4 2.2 4.07 2.2 4.9 V11.1 C2.2 11.93 2.87 12.6 3.7 12.6 H6.4" />
    <!-- 向左并入箭头 -->
    <g class="arrow">
      <path d="M13.8 8 H6.2" />
      <path d="M8.7 5.5 L6.1 8 L8.7 10.5" />
    </g>
  </g>
</svg>