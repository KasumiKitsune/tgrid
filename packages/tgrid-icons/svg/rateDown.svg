<svg class="tg-icon tg-icon--rate-down" viewBox="0 0 16 16" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .tg-fill, .tg-src-fill, .tg-dst-fill {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .tg-pane-fill {
      opacity: 0.09;
      transition: opacity 0.2s ease;
    }
    .tg-sub {
      opacity: 0.72;
      transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    svg:hover .tg-fill, svg:hover .tg-src-fill, svg:hover .tg-dst-fill { opacity: 0.14; }
    svg:hover .tg-pane-fill { opacity: 0.2; }
    svg:hover .tg-sub { opacity: 1; }
    .tg-needle { transform-origin: 8px 10.5px; transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease; }
    svg:hover .tg-needle { transform: rotate(-12deg); stroke: #2563eb; }
  </style>
  <!-- 按下态表盘微填充 -->
  <path class="tg-fill" d="M2.5 9.5A5.75 5.75 0 1 1 13.5 9.5Z" fill="currentColor" />
  <!-- 开口速度表盘外弧 -->
  <path class="tg-sub" d="M2.5 9.5A5.75 5.75 0 1 1 13.5 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <!-- 减速指针与圆心轴点 -->
  <g class="tg-needle">
    <path d="M8 8.25L5.5 5.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="8" cy="8.25" r="1.15" fill="currentColor" />
  </g>
  <!-- 底部减号 -->
  <path class="tg-sign" d="M6.35 12.75H9.65" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
</svg>
