<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .cst-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cst-pane {
      fill: #374151;
      fill-opacity: 0.09;
      transition: fill 0.2s ease, fill-opacity 0.2s ease;
    }
    .cst-divider {
      stroke: #374151;
      stroke-width: 1.4;
      transition: stroke 0.2s ease;
    }
    .cst-frame {
      stroke: #374151;
      stroke-width: 1.45;
      transition: stroke 0.2s ease;
    }
    .cst-chev {
      stroke: #4b5563;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .cst-frame {
      stroke: #111827;
    }
    svg:hover .cst-pane {
      fill: #2563eb;
      fill-opacity: 0.14;
    }
    svg:hover .cst-divider {
      stroke: #2563eb;
    }
    svg:hover .cst-chev {
      stroke: #2563eb;
      transform: translateX(-0.65px);
    }

    svg:active .cst-root {
      transform: scale(0.91);
    }
    svg:active .cst-pane {
      fill-opacity: 0.18;
    }
    svg:active .cst-chev {
      transform: translateX(-0.95px);
    }
  </style>

  <g class="cst-root">
    <!-- 1. 左侧词条栏微底纹（最底层） -->
    <path class="cst-pane" d="M6 2.6 H3.5 C2.67 2.6 2 3.27 2 4.1 V11.9 C2 12.73 2.67 13.4 3.5 13.4 H6 V2.6 Z" />
    <!-- 2. 内部分割线（起止点内收并置于外框下方，悬停变蓝绝不压坏上下黑框） -->
    <path class="cst-divider" d="M6 3.1 V12.9" />
    <!-- 3. 闭合窗口外框（压在分割线之上，保持完整无缺口） -->
    <rect class="cst-frame" x="2" y="2.6" width="12" height="10.8" rx="1.5" />
    <!-- 4. 指向左侧栏的展开 / 收起尖角 -->
    <path class="cst-chev" d="M10.8 6.25 L9.1 8 L10.8 9.75" />
  </g>
</svg>