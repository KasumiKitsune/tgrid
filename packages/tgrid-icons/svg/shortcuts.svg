<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .sc-root {
      transform-origin: 8px 8px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .sc-ring {
      stroke: #374151;
      stroke-width: 1.4;
      fill: rgba(37, 99, 235, 0);
      transition: stroke 0.2s ease, fill 0.2s ease;
    }
    .sc-q {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform-origin: 8px 9px;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), stroke 0.2s ease;
    }
    .sc-dot {
      fill: #374151;
      transform-origin: 8px 11.2px;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) 30ms, fill 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .sc-ring {
      stroke: #111827;
      fill: rgba(37, 99, 235, 0.08);
    }
    svg:hover .sc-q {
      stroke: #2563eb;
      transform: translateY(-0.55px) rotate(6deg);
    }
    svg:hover .sc-dot {
      fill: #2563eb;
      transform: translateY(0.25px) scale(1.1);
    }
    svg:active .sc-root { transform: scale(0.91); }
  </style>

  <g class="sc-root">
    <circle class="sc-ring" cx="8" cy="8" r="5.8" />
    <path
      class="sc-q"
      d="M6.25 6.35 C6.25 5.35 7.0 4.7 8.05 4.7 C9.05 4.7 9.75 5.3 9.75 6.15 C9.75 6.9 9.25 7.35 8.55 7.75 C8.15 7.98 7.98 8.25 7.98 8.72 V9.05"
    />
    <circle class="sc-dot" cx="8" cy="11.2" r="0.85" />
  </g>
</svg>
