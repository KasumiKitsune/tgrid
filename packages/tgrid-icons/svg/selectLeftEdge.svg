<svg class="tg-icon tg-icon--select-left" viewBox="0 0 16 16" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .tg-fill, .tg-src-fill, .tg-dst-fill {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .tg-pane-fill {
      opacity: 0.09;
      transition: opacity 0.2s ease;
    }
    .tg-sub {
      opacity: 0.72;
      transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    svg:hover .tg-fill, svg:hover .tg-src-fill, svg:hover .tg-dst-fill { opacity: 0.14; }
    svg:hover .tg-pane-fill { opacity: 0.2; }
    svg:hover .tg-sub { opacity: 1; }
    .tg-ptr { transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease; }
    svg:hover .tg-ptr { transform: translateX(-0.55px); stroke: #2563eb; }
  </style>
  <!-- 按下态左边界选中高亮带 -->
  <rect class="tg-fill" x="2.5" y="3.75" width="3" height="8.5" rx="0.5" fill="currentColor" />
  <!-- 右侧延伸的区间体 -->
  <path class="tg-sub" d="M2.5 3.75H12.75C13.44 3.75 14 4.31 14 5V11C14 11.69 13.44 12.25 12.75 12.25H2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- 被选中的通高左边界 -->
  <path d="M2.5 1.75V14.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <!-- 指向左边界的选中箭头 -->
  <path class="tg-ptr" d="M10.75 8H5.5M7.25 6.35L5.5 8L7.25 9.65" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
