<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .st-root {
      transform-origin: 8px 8px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .st-lid {
      stroke: #374151;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform-origin: 8px 8px;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    .st-iris {
      stroke: #374151;
      stroke-width: 1.5;
      fill: rgba(37, 99, 235, 0);
      transform-origin: 8px 8px;
      transition:
        transform 0.26s cubic-bezier(0.22, 1, 0.36, 1),
        stroke 0.2s ease,
        fill 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .st-lid {
      stroke: #111827;
      transform: scaleY(1.06);
    }
    svg:hover .st-iris {
      stroke: #2563eb;
      fill: rgba(37, 99, 235, 0.16);
      transform: scale(1.08);
    }
    svg:active .st-root { transform: scale(0.91); }
  </style>

  <g class="st-root">
    <!-- 眼部外轮廓（与 hideTier 坐标完全一致） -->
    <path class="st-lid" d="M1.75 8 C3.3 4.3 5.5 3 8 3 C10.5 3 12.7 4.3 14.25 8 C12.7 11.7 10.5 13 8 13 C5.5 13 3.3 11.7 1.75 8 Z" />
    <!-- 完整虹膜 -->
    <circle class="st-iris" cx="8" cy="8" r="2.4" />
  </g>
</svg>
