<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .win-min {
      stroke: #4b5563;
      stroke-width: 1.6;
      stroke-linecap: round;
      transform-origin: 8px 8px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    svg { cursor: pointer; overflow: visible; }
    svg:hover .win-min {
      stroke: #111827;
      transform: translateY(1.2px);
    }
    svg:active .win-min {
      transform: translateY(2px) scaleX(0.9);
    }
  </style>

  <path class="win-min" d="M3.2 8.2 H12.8" />
</svg>