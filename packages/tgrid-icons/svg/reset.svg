<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .rst-root {
      transform-origin: 8px 8px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .rst-spin {
      transform-origin: 8.15px 8px;
      transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .rst-main {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }
    .rst-wake {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linecap: round;
      transition: stroke 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .rst-spin { transform: rotate(-38deg); }
    svg:hover .rst-main { stroke: #2563eb; }
    svg:hover .rst-wake { stroke: #111827; }
    svg:active .rst-root { transform: scale(0.91); }
  </style>

  <g class="rst-root">
    <g class="rst-spin">
      <!-- 主回旋圆弧与直角箭头（G1 连续切线过渡） -->
      <g class="rst-main">
        <path d="M2.85 5.75 A6.15 6.15 0 0 1 8.15 2.55 A5.45 5.45 0 1 1 4.79 12.29" />
        <path d="M2.85 2.95 V5.75 H5.65" />
      </g>
      <!-- 左下光学断口尾迹短弧 -->
      <path class="rst-wake" d="M3.21 10.3 A5.45 5.45 0 0 1 2.71 8.29" />
    </g>
  </g>
</svg>
