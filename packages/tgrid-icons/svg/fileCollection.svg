<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .fc-root {
      transform-origin: 8px 8px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .fc-file {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }
    .fc-wave {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      transform-origin: 7.8px 5.6px;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    .fc-tier {
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .fc-tier-box {
      stroke: #374151;
      stroke-width: 1.35;
      stroke-linejoin: round;
      fill: rgba(37, 99, 235, 0);
      transition: stroke 0.2s ease, fill 0.2s ease;
    }
    .fc-tier-div {
      stroke: #374151;
      stroke-width: 1.35;
      stroke-linecap: round;
      transition: stroke 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .fc-file { stroke: #111827; }
    svg:hover .fc-wave {
      stroke: #2563eb;
      transform: translateY(-0.2px) scaleY(1.08);
    }
    svg:hover .fc-tier { transform: translateY(0.2px); }
    svg:hover .fc-tier-box {
      stroke: #111827;
      fill: rgba(37, 99, 235, 0.13);
    }
    svg:hover .fc-tier-div { stroke: #2563eb; }
    svg:active .fc-root { transform: scale(0.91); }
  </style>

  <g class="fc-root">
    <!-- 45° 切角文档轮廓（与 save 外框完全同源） -->
    <path class="fc-file" d="M3.25 2 H11.15 L14 4.85 V12.75 C14 13.44 13.44 14 12.75 14 H3.25 C2.56 14 2 13.44 2 12.75 V3.25 C2 2.56 2.56 2 3.25 2 Z" />
    <!-- 上半部：音频对象波形 -->
    <path class="fc-wave" d="M5.5 5 V6.2 M7.8 4.1 V7.1 M10.1 4.75 V6.45" />
    <!-- 下半部：TextGrid 区间层对象 -->
    <g class="fc-tier">
      <rect class="fc-tier-box" x="4.8" y="9.6" width="6.4" height="2.4" rx="0.55" />
      <path class="fc-tier-div" d="M7.8 9.6 V12" />
    </g>
  </g>
</svg>
