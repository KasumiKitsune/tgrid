<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .cf-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cf-back {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }
    .cf-flap-wrap {
      transform-origin: 8px 13.3px;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cf-flap {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: rgba(37, 99, 235, 0);
      transition: stroke 0.22s ease, fill 0.22s ease;
    }
    .cf-bar {
      stroke: #374151;
      stroke-width: 1.35;
      stroke-linecap: round;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), stroke 0.2s ease;
    }
    .cf-b1 { transform-origin: 5.7px 9.92px; transition-delay: 0ms; }
    .cf-b2 { transform-origin: 8px 9.92px; transition-delay: 35ms; }
    .cf-b3 { transform-origin: 10.3px 9.92px; transition-delay: 70ms; }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .cf-back {
      stroke: #111827;
    }
    svg:hover .cf-flap-wrap {
      transform: skewX(-8deg) scaleY(0.88);
    }
    svg:hover .cf-flap {
      stroke: #2563eb;
      fill: rgba(37, 99, 235, 0.08);
    }
    svg:hover .cf-bar {
      stroke: #2563eb;
    }
    svg:hover .cf-b1 { transform: scaleY(1.18); }
    svg:hover .cf-b2 { transform: scaleY(1.08); }
    svg:hover .cf-b3 { transform: scaleY(0.92); }

    svg:active .cf-root {
      transform: scale(0.91);
    }
    svg:active .cf-flap-wrap {
      transform: skewX(-5deg) scaleY(0.92);
    }
    svg:active .cf-flap {
      fill: rgba(37, 99, 235, 0.14);
    }
  </style>

  <g class="cf-root">
    <!-- 文件夹后背板 -->
    <path class="cf-back" d="M2 12.1 V3.8 C2 3.08 2.58 2.5 3.3 2.5 H5.95 C6.38 2.5 6.78 2.71 7.02 3.06 L7.58 3.84 C7.76 4.1 8.05 4.25 8.37 4.25 H12.7 C13.42 4.25 14 4.83 14 5.55 V12.1 C14 12.76 13.46 13.3 12.8 13.3 H3.2 C2.54 13.3 2 12.76 2 12.1 Z" />
    <!-- 前翻盖与内置语音声波（随翻盖一体微斜） -->
    <g class="cf-flap-wrap">
      <path class="cf-flap" d="M2 7.75 C2 7.09 2.54 6.55 3.2 6.55 H12.8 C13.46 6.55 14 7.09 14 7.75 V12.1 C14 12.76 13.46 13.3 12.8 13.3 H3.2 C2.54 13.3 2 12.76 2 12.1 Z" />
      <path class="cf-bar cf-b1" d="M5.7 9.35 V10.5" />
      <path class="cf-bar cf-b2" d="M8 8.65 V11.2" />
      <path class="cf-bar cf-b3" d="M10.3 9.05 V10.8" />
    </g>
  </g>
</svg>