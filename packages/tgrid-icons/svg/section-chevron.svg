<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .sec-chevron {
      stroke: #6b7280;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform-origin: 8px 8px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    svg { cursor: pointer; overflow: visible; }
    svg:hover .sec-chevron {
      stroke: #111827;
      transform: translateX(1.2px);
    }
    svg:active .sec-chevron {
      stroke: #2563eb;
      transform: translateX(1.8px) scale(0.9);
    }
  </style>

  <path class="sec-chevron" d="M6 3.5 L10.5 8 L6 12.5" />
</svg>