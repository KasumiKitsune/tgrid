<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .cp-press {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cp-ring {
      stroke: #4b5563;
      stroke-width: 1.25;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform-origin: 8px 8px;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.22s ease;
    }
    .cp-glyph {
      stroke: #1f2937;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform-origin: 8px 8px;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), stroke 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .cp-ring {
      stroke: #2563eb;
      transform: rotate(180deg);
    }
    svg:hover .cp-glyph {
      stroke: #2563eb;
      transform: scale(1.1);
    }
    svg:active .cp-press { transform: scale(0.91); }
  </style>

  <g class="cp-press">
    <!-- 外围对称双转换弧（与 convertUnicode 完全一致） -->
    <g class="cp-ring">
      <path d="M3.1 4.2 A6.2 6.2 0 0 1 12.9 4.2" />
      <path d="M11.1 4 L12.9 4.2 L12.8 2.3" />
      <path d="M12.9 11.8 A6.2 6.2 0 0 1 3.1 11.8" />
      <path d="M4.9 12 L3.1 11.8 L3.2 13.7" />
    </g>
    <!-- 中心标识：清晰分离的 \x -->
    <g class="cp-glyph">
      <path d="M4.65 5.45 L6.45 10.55" />
      <path d="M8.55 6.95 L11.35 10.45" />
      <path d="M11.35 6.95 L8.55 10.45" />
    </g>
  </g>
</svg>
