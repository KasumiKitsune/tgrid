<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .fw-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .base-win {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }
    .pop-win {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linejoin: round;
      fill: rgba(37, 99, 235, 0);
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease, fill 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .base-win { stroke: #111827; }
    svg:hover .pop-win {
      stroke: #2563eb;
      fill: rgba(37, 99, 235, 0.12);
      transform: translate(0.65px, -0.65px);
    }
    svg:active .fw-root { transform: scale(0.91); }
  </style>

  <g class="fw-root">
    <!-- 主视口边框（右上避让悬浮窗） -->
    <path class="base-win" d="M6 3.4 H3.6 C2.72 3.4 2 4.12 2 5 V11.4 C2 12.28 2.72 13 3.6 13 H10.8 C11.68 13 12.4 12.28 12.4 11.4 V9.2" />
    <!-- 独立悬浮小窗 -->
    <rect class="pop-win" x="7.8" y="2.2" width="6.2" height="5" rx="1.2" />
  </g>
</svg>