<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .zr-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .bound {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linecap: round;
      transition: stroke 0.2s ease;
    }
    .axis {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      transform-origin: 8px 8px;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    .arr {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .bound { stroke: #111827; }
    svg:hover .axis { stroke: #2563eb; transform: scaleX(1.16); }
    svg:hover .arr-l { stroke: #2563eb; transform: translateX(-0.65px); }
    svg:hover .arr-r { stroke: #2563eb; transform: translateX(0.65px); }
    svg:active .zr-root { transform: scale(0.91); }
  </style>

  <g class="zr-root">
    <!-- 时间轴起止边界 -->
    <path class="bound" d="M2.2 3.2 V12.8" />
    <path class="bound" d="M13.8 3.2 V12.8" />
    <!-- 双向撑满箭头 -->
    <path class="axis" d="M5 8 H11" />
    <path class="arr arr-l" d="M6.8 5.9 L4.7 8 L6.8 10.1" />
    <path class="arr arr-r" d="M9.2 5.9 L11.3 8 L9.2 10.1" />
  </g>
</svg>