<svg class="tg-icon tg-icon--nav-h" viewBox="0 0 16 16" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .tg-fill, .tg-src-fill, .tg-dst-fill {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .tg-pane-fill {
      opacity: 0.09;
      transition: opacity 0.2s ease;
    }
    .tg-sub {
      opacity: 0.72;
      transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    svg:hover .tg-fill, svg:hover .tg-src-fill, svg:hover .tg-dst-fill { opacity: 0.14; }
    svg:hover .tg-pane-fill { opacity: 0.2; }
    svg:hover .tg-sub { opacity: 1; }
    svg:hover .tg-chev-l { transform: translateX(-0.6px); }
    svg:hover .tg-chev-r { transform: translateX(0.6px); }
  </style>
  <!-- 按下态聚焦区间底纹 -->
  <rect class="tg-fill" x="5.75" y="5.5" width="4.5" height="5" rx="1" fill="currentColor" />
  <!-- 当前聚焦区间框 -->
  <rect x="5.75" y="5.5" width="4.5" height="5" rx="1" stroke="currentColor" stroke-width="1.5" />
  <!-- 左 / 右切换尖角 -->
  <path class="tg-sub tg-chev-l" d="M3.5 5.75L1.75 8L3.5 10.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="tg-sub tg-chev-r" d="M12.5 5.75L14.25 8L12.5 10.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
