<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .cfa-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cfa-frame {
      stroke: #374151;
      stroke-width: 1.4;
      fill: rgba(37, 99, 235, 0);
      transition: stroke 0.2s ease, fill 0.2s ease;
    }
    .cfa-dot {
      fill: #6b7280;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), fill 0.2s ease;
    }
    .cfa-d1 { transform-origin: 5px 5.2px; transition-delay: 0ms; }
    .cfa-d2 { transform-origin: 5px 8px; transition-delay: 35ms; }
    .cfa-d3 { transform-origin: 5px 10.8px; transition-delay: 70ms; }
    .cfa-line {
      stroke: #374151;
      stroke-width: 1.35;
      stroke-linecap: round;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    .cfa-l1 { transition-delay: 0ms; }
    .cfa-l2 { transition-delay: 35ms; }
    .cfa-l3 { transition-delay: 70ms; }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .cfa-frame {
      stroke: #111827;
      fill: rgba(37, 99, 235, 0.08);
    }
    svg:hover .cfa-dot {
      fill: #2563eb;
      transform: scale(1.18);
    }
    svg:hover .cfa-line {
      stroke: #2563eb;
      transform: translateX(0.4px);
    }

    svg:active .cfa-root {
      transform: scale(0.91);
    }
    svg:active .cfa-frame {
      stroke: #2563eb;
      fill: rgba(37, 99, 235, 0.14);
    }
    svg:active .cfa-dot {
      fill: #2563eb;
      transform: scale(1.05);
    }
    svg:active .cfa-line {
      stroke: #2563eb;
      transform: translateX(0.55px);
    }
  </style>

  <g class="cfa-root">
    <!-- 11.6px 圆角词表容器（与四态徽章视觉量感对齐） -->
    <rect class="cfa-frame" x="2.2" y="2.2" width="11.6" height="11.6" rx="1.8" />
    <!-- 三行词条队列（状态锚点 + 词条横线） -->
    <circle class="cfa-dot cfa-d1" cx="5" cy="5.2" r="0.82" />
    <path class="cfa-line cfa-l1" d="M7.5 5.2 H11" />
    <circle class="cfa-dot cfa-d2" cx="5" cy="8" r="0.82" />
    <path class="cfa-line cfa-l2" d="M7.5 8 H11" />
    <circle class="cfa-dot cfa-d3" cx="5" cy="10.8" r="0.82" />
    <path class="cfa-line cfa-l3" d="M7.5 10.8 H9.9" />
  </g>
</svg>