<svg class="tg-icon tg-icon--next-empty" viewBox="0 0 16 16" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .tg-fill, .tg-src-fill, .tg-dst-fill {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .tg-pane-fill {
      opacity: 0.09;
      transition: opacity 0.2s ease;
    }
    .tg-sub {
      opacity: 0.72;
      transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    svg:hover .tg-fill, svg:hover .tg-src-fill, svg:hover .tg-dst-fill { opacity: 0.14; }
    svg:hover .tg-pane-fill { opacity: 0.2; }
    svg:hover .tg-sub { opacity: 1; }
    .tg-jump { transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease; }
    svg:hover .tg-jump { transform: translateX(0.65px); stroke: #2563eb; }
  </style>
  <!-- 按下态目标空白区间选中底纹 -->
  <rect class="tg-fill" x="8.75" y="3.5" width="5.5" height="9" rx="1" fill="currentColor" />
  <!-- 向右跳转箭头 -->
  <path class="tg-jump" d="M1.75 8H6.25M4.25 6L6.25 8L4.25 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- 右侧四角虚线空白区间 -->
  <path class="tg-sub" d="M8.75 5.75V4.5C8.75 3.95 9.2 3.5 9.75 3.5H10.25M12.75 3.5H13.25C13.8 3.5 14.25 3.95 14.25 4.5V5.75M14.25 10.25V11.5C14.25 12.05 13.8 12.5 13.25 12.5H12.75M10.25 12.5H9.75C9.2 12.5 8.75 12.05 8.75 11.5V10.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
