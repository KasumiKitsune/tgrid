<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .zi-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .corner {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    .plus {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linecap: round;
      transform-origin: 8px 8px;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .corner { stroke: #111827; }
    svg:hover .c-tl { transform: translate(-0.6px, -0.6px); }
    svg:hover .c-tr { transform: translate(0.6px, -0.6px); }
    svg:hover .c-br { transform: translate(0.6px, 0.6px); }
    svg:hover .c-bl { transform: translate(-0.6px, 0.6px); }
    svg:hover .plus { stroke: #2563eb; transform: scale(1.12); }
    svg:active .zi-root { transform: scale(0.91); }
  </style>

  <g class="zi-root">
    <!-- 四角选区框 -->
    <path class="corner c-tl" d="M2.2 5.2 V3.4 C2.2 2.74 2.74 2.2 3.4 2.2 H5.2" />
    <path class="corner c-tr" d="M10.8 2.2 H12.6 C13.26 2.2 13.8 2.74 13.8 3.4 V5.2" />
    <path class="corner c-br" d="M13.8 10.8 V12.6 C13.8 13.26 13.26 13.8 12.6 13.8 H10.8" />
    <path class="corner c-bl" d="M5.2 13.8 H3.4 C2.74 13.8 2.2 13.26 2.2 12.6 V10.8" />
    <!-- 中心加号 -->
    <path class="plus" d="M8 5.6 V10.4 M5.6 8 H10.4" />
  </g>
</svg>