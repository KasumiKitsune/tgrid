<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .norm-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .bound {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      transition: stroke 0.2s ease;
    }
    .seg {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linecap: round;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    .s1 { transform-origin: 4.8px 4.5px; transition-delay: 0ms; }
    .s2 { transform-origin: 8px 8px;     transition-delay: 40ms; }
    .s3 { transform-origin: 11.2px 11.5px; transition-delay: 80ms; }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .bound { stroke: #111827; }
    svg:hover .seg { stroke: #2563eb; }
    /* 悬停瞬间齐刷刷向两侧边界延展对齐 */
    svg:hover .s1 { transform: scaleX(1.36); }
    svg:hover .s2 { transform: scaleX(1.22); }
    svg:hover .s3 { transform: scaleX(1.36); }
    svg:active .norm-root { transform: scale(0.91); }
  </style>

  <g class="norm-root">
    <!-- 左右基准边界 -->
    <path class="bound" d="M2.2 2.8 V13.2" />
    <path class="bound" d="M13.8 2.8 V13.2" />
    <!-- 内部待规整区间条（静态微错落，悬停对齐齐平） -->
    <path class="seg s1" d="M4.8 4.5 H9.5" />
    <path class="seg s2" d="M5.4 8 H10.6" />
    <path class="seg s3" d="M6.5 11.5 H11.2" />
  </g>
</svg>