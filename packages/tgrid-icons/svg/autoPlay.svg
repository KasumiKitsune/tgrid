<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .ap-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .ap-ring {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform-origin: 8px 8px;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    .ap-play {
      stroke: #374151;
      stroke-width: 1.35;
      stroke-linejoin: round;
      fill: rgba(37, 99, 235, 0);
      transform-origin: 8px 8px;
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease, fill 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .ap-ring {
      stroke: #111827;
      transform: rotate(22deg);
    }
    svg:hover .ap-play {
      stroke: #2563eb;
      fill: rgba(37, 99, 235, 0.12);
      transform: translateX(0.45px);
    }

    svg:active .ap-root {
      transform: scale(0.91);
    }
    svg:active .ap-ring {
      stroke: #2563eb;
      transform: rotate(34deg);
    }
    svg:active .ap-play {
      stroke: #2563eb;
      fill: rgba(37, 99, 235, 0.14);
      transform: translateX(0.65px);
    }
  </style>

  <g class="ap-root">
    <!-- 外圈单向自动触发环箭 -->
    <g class="ap-ring">
      <path d="M13.17 10.52 A5.75 5.75 0 1 1 12.53 4.46" />
      <path d="M12.53 2.31 V4.46 H10.38" />
    </g>
    <!-- 居中微圆角播放三角（与 play.svg 比例同源） -->
    <path class="ap-play" d="M6.4 6 Q6.4 5.45 6.87 5.74 L9.98 7.71 Q10.45 8 9.98 8.29 L6.87 10.26 Q6.4 10.55 6.4 10 Z" />
  </g>
</svg>