<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .rm-root {
      transform-origin: 8px 8px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .rm-book {
      transform-origin: 8px 8.8px;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .rm-page-l, .rm-page-r {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease, fill 0.2s ease;
    }
    .rm-page-r {
      fill: rgba(37, 99, 235, 0);
    }
    .rm-spine {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      transition: stroke 0.2s ease;
    }
    .rm-mark {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      transform-origin: 11px 3.12px;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .rm-book {
      transform: scaleX(1.05) translateY(-0.25px);
    }
    svg:hover .rm-page-l { stroke: #111827; }
    svg:hover .rm-page-r {
      stroke: #111827;
      fill: rgba(37, 99, 235, 0.11);
    }
    svg:hover .rm-spine { stroke: #2563eb; }
    svg:hover .rm-mark {
      stroke: #2563eb;
      transform: scaleY(1.25);
    }
    svg:active .rm-root { transform: scale(0.91); }
  </style>

  <g class="rm-root">
    <g class="rm-book">
      <!-- 左页与右页轮廓 -->
      <path class="rm-page-l" d="M8 4.15 C6.75 3.25 4.85 2.95 2.75 3.05 C2.33 3.07 2 3.42 2 3.85 V11.7 C2 12.13 2.34 12.48 2.77 12.5 C4.85 12.58 6.75 12.88 8 13.75" />
      <path class="rm-page-r" d="M8 4.15 C9.25 3.25 11.15 2.95 13.25 3.05 C13.67 3.07 14 3.42 14 3.85 V11.7 C14 12.13 13.66 12.48 13.23 12.5 C11.15 12.58 9.25 12.88 8 13.75" />
      <!-- 书脊中缝与阅读书签 -->
      <path class="rm-spine" d="M8 4.15 V13.75" />
      <path class="rm-mark" d="M11 3.12 V6.3" />
    </g>
  </g>
</svg>
