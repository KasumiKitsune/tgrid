<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .epng-root {
      transform-origin: 8px 8px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .epng-frame {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }
    .epng-tint {
      fill: rgba(37, 99, 235, 0);
      transition: fill 0.22s ease;
    }
    .epng-peaks {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }
    .epng-sun {
      fill: #374151;
      stroke: #374151;
      stroke-width: 0.6;
      transform-origin: 5.5px 5.7px;
      transition:
        transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
        fill 0.2s ease,
        stroke 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .epng-frame { stroke: #111827; }
    svg:hover .epng-tint { fill: rgba(37, 99, 235, 0.14); }
    svg:hover .epng-peaks { stroke: #2563eb; }
    svg:hover .epng-sun {
      fill: #2563eb;
      stroke: #2563eb;
      transform: translate(0.2px, -0.4px) scale(1.08);
    }
    svg:active .epng-root { transform: scale(0.91); }
  </style>

  <g class="epng-root">
    <!-- 山脊悬停底纹（贴合画框右下内壁） -->
    <path class="epng-tint" d="M3.5 13.7 L9.25 7.95 C9.64 7.56 10.26 7.56 10.65 7.95 L13.9 11.2 V12.15 C13.9 13.01 13.21 13.7 12.35 13.7 Z" />
    <!-- 位图画框 -->
    <rect class="epng-frame" x="2.1" y="2.3" width="11.8" height="11.4" rx="1.55" />
    <!-- 山峰折线与太阳圆点 -->
    <path class="epng-peaks" d="M3.5 13.7 L9.25 7.95 C9.64 7.56 10.26 7.56 10.65 7.95 L13.9 11.2" />
    <circle class="epng-sun" cx="5.5" cy="5.7" r="1.15" />
  </g>
</svg>
