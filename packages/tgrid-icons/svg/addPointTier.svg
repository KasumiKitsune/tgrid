<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .pt-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .pt-axis {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    .pt-diamond {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linejoin: round;
      fill: rgba(37, 99, 235, 0);
      transform-origin: 8px 8px;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), stroke 0.2s ease, fill 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .pt-axis { stroke: #111827; }
    svg:hover .ax-l { transform: translateX(-0.35px); }
    svg:hover .ax-r { transform: translateX(0.35px); }
    svg:hover .pt-diamond {
      stroke: #2563eb;
      fill: rgba(37, 99, 235, 0.14);
      transform: scale(1.14);
    }
    svg:active .pt-root { transform: scale(0.91); }
  </style>

  <g class="pt-root">
    <!-- 左右分段水平时间轴 -->
    <path class="pt-axis ax-l" d="M2 8 H5.1" />
    <path class="pt-axis ax-r" d="M10.9 8 H14" />
    <!-- 中心声学事件菱形点 -->
    <path class="pt-diamond" d="M8 5.1 L10.9 8 L8 10.9 L5.1 8 Z" />
  </g>
</svg>
