<svg class="tg-icon tg-icon--project-tier" viewBox="0 0 16 16" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .tg-fill {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .tg-sub {
      opacity: 0.72;
      transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    svg:hover .tg-fill { opacity: 0.14; }
    svg:hover .tg-sub { opacity: 1; }
    .tg-arrow {
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    svg:hover .tg-arrow { transform: translateY(0.75px); stroke: #2563eb; }
  </style>
  <!-- 按下态目标层接收填充 -->
  <rect class="tg-fill" x="2.5" y="11" width="11" height="3" rx="0.5" fill="currentColor" />
  <!-- 上方源层级 -->
  <rect x="2" y="1.5" width="12" height="3.5" rx="1" stroke="currentColor" stroke-width="1.5" />
  <!-- 垂直跨层投射箭头 -->
  <path class="tg-arrow" d="M8 7.5V11.5M6 9.5L8 11.5L10 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- 下方目标层级（居中承接开口） -->
  <path class="tg-sub" d="M3.5 10.5H3C2.45 10.5 2 10.95 2 11.5V13.5C2 14.05 2.45 14.5 3 14.5H13C13.55 14.5 14 14.05 14 13.5V11.5C14 10.95 13.55 10.5 13 10.5H12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
