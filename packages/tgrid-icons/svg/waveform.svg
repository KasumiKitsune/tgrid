<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .wave-root {
      transform-origin: 8px 8px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .bar {
      stroke: #374151;
      stroke-width: 1.6;
      stroke-linecap: round;
      transform-origin: 8px 8px;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), stroke 0.22s ease;
    }
    .b1 { transform-origin: 2.6px 8px; transition-delay: 0ms; }
    .b2 { transform-origin: 5.3px 8px; transition-delay: 35ms; }
    .b3 { transform-origin: 8px 8px;   transition-delay: 70ms; }
    .b4 { transform-origin: 10.7px 8px; transition-delay: 35ms; }
    .b5 { transform-origin: 13.4px 8px; transition-delay: 0ms; }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .b1 { stroke: #111827; transform: scaleY(1.35); }
    svg:hover .b2 { stroke: #2563eb; transform: scaleY(0.78); }
    svg:hover .b3 { stroke: #2563eb; transform: scaleY(1.16); }
    svg:hover .b4 { stroke: #2563eb; transform: scaleY(1.24); }
    svg:hover .b5 { stroke: #111827; transform: scaleY(1.35); }
    svg:active .wave-root { transform: scale(0.9); }
  </style>

  <g class="wave-root">
    <path class="bar b1" d="M2.6 6.4 V9.6" />
    <path class="bar b2" d="M5.3 4.2 V11.8" />
    <path class="bar b3" d="M8 2.6 V13.4" />
    <path class="bar b4" d="M10.7 4.8 V11.2" />
    <path class="bar b5" d="M13.4 6.4 V9.6" />
  </g>
</svg>