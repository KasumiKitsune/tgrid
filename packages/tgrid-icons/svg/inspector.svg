<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .insp-root {
      transform-origin: 8px 8px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .track {
      stroke: #374151;
      stroke-width: 1.35;
      stroke-linecap: round;
      transition: stroke 0.2s ease;
    }
    .knob {
      stroke: #374151;
      stroke-width: 1.35;
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    .knob-cut {
      fill: #000000;
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .track { stroke: #111827; }
    svg:hover .knob { stroke: #2563eb; }
    svg:hover .k1 { transform: translateX(4.4px); }
    svg:hover .k2 { transform: translateX(-5px); }
    svg:hover .k3 { transform: translateX(4.2px); }
    svg:active .insp-root { transform: scale(0.91); }
  </style>

  <defs>
    <mask id="insp-track-mask-v2">
      <rect width="16" height="16" fill="#ffffff" />
      <circle class="knob-cut k1" cx="5.2" cy="3.3" r="1.55" />
      <circle class="knob-cut k2" cx="10.8" cy="8" r="1.55" />
      <circle class="knob-cut k3" cx="6.4" cy="12.7" r="1.55" />
    </mask>
  </defs>

  <g class="insp-root">
    <g mask="url(#insp-track-mask-v2)">
      <path class="track" d="M2 3.3 H14" />
      <path class="track" d="M2 8 H14" />
      <path class="track" d="M2 12.7 H14" />
    </g>
    <circle class="knob k1" cx="5.2" cy="3.3" r="1.3" />
    <circle class="knob k2" cx="10.8" cy="8" r="1.3" />
    <circle class="knob k3" cx="6.4" cy="12.7" r="1.3" />
  </g>
</svg>