<svg class="tg-icon tg-icon--ipa-mode" viewBox="0 0 16 16" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .tg-fill, .tg-src-fill, .tg-dst-fill {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .tg-pane-fill {
      opacity: 0.09;
      transition: opacity 0.2s ease;
    }
    .tg-sub {
      opacity: 0.72;
      transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    svg:hover .tg-fill, svg:hover .tg-src-fill, svg:hover .tg-dst-fill { opacity: 0.14; }
    svg:hover .tg-pane-fill { opacity: 0.2; }
    svg:hover .tg-sub { opacity: 1; }
    .tg-cycle { transform-origin: 8px 8px; }
    .tg-schwa { transition: stroke 0.2s ease; }
    svg:hover .tg-cycle { transform: rotate(30deg); }
    svg:hover .tg-schwa { stroke: #2563eb; }
  </style>
  <!-- 外围双循环弧箭头（呼应示例 2） -->
  <g class="tg-sub tg-cycle">
    <path d="M3.25 4A6.25 6.25 0 0 1 12.75 4M10.75 4.25L12.85 4.15L12.7 2.05" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M12.75 12A6.25 6.25 0 0 1 3.25 12M5.25 11.75L3.15 11.85L3.3 13.95" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- 居中 IPA 央元音 ə -->
  <path class="tg-schwa" d="M10.15 8.15H5.85C5.85 9.85 6.75 11 8.05 11C9.35 11 10.2 9.85 10.2 8.15V7.75C10.2 6.05 9.35 5 8.05 5C7.25 5 6.6 5.25 6.15 5.75" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
