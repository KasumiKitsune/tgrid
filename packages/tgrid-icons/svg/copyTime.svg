<svg class="tg-icon tg-icon--copy-time" viewBox="0 0 16 16" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .tg-fill {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .tg-sub {
      opacity: 0.72;
      transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    svg:hover .tg-fill { opacity: 0.14; }
    svg:hover .tg-sub { opacity: 1; }
    .tg-clock {
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    svg:hover .tg-copy-back { transform: translate(-0.45px, -0.45px); }
    svg:hover .tg-clock { transform: translate(0.35px, 0.35px); }
  </style>
  <!-- 后景复制角框 -->
  <path class="tg-sub tg-copy-back" d="M2 9.5V3.25C2 2.56 2.56 2 3.25 2H9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- 前景表盘（按下态柔和底纹） -->
  <g class="tg-clock">
    <circle class="tg-fill" cx="9.5" cy="9.5" r="4.5" fill="currentColor" />
    <circle cx="9.5" cy="9.5" r="4.5" stroke="currentColor" stroke-width="1.5" />
    <path d="M9.5 7.5V9.5L11 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
