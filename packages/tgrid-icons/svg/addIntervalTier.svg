<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .it-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .it-frame {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linejoin: round;
      fill: rgba(37, 99, 235, 0);
      transition: stroke 0.2s ease, fill 0.2s ease;
    }
    .it-divider {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .it-frame {
      stroke: #111827;
      fill: rgba(37, 99, 235, 0.06);
    }
    svg:hover .it-divider {
      stroke: #2563eb;
      transform: translateX(1.3px);
    }
    svg:active .it-root { transform: scale(0.91); }
  </style>

  <g class="it-root">
    <rect class="it-frame" x="2.2" y="4.2" width="11.6" height="7.6" rx="1.6" />
    <path class="it-divider" d="M8 4.2 V11.8" />
  </g>
</svg>