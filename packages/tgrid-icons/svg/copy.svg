<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .copy-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .sheet-back {
      stroke: #4b5563;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    .sheet-front {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linejoin: round;
      fill: rgba(37, 99, 235, 0);
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease, fill 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .sheet-back {
      stroke: #111827;
      transform: translate(-0.4px, -0.4px);
    }
    svg:hover .sheet-front {
      stroke: #2563eb;
      fill: rgba(37, 99, 235, 0.1);
      transform: translate(0.5px, 0.5px);
    }
    svg:active .copy-root { transform: scale(0.91); }
  </style>

  <g class="copy-root">
    <!-- 后页轮廓 -->
    <path class="sheet-back" d="M5.6 10.4 H3.8 C2.92 10.4 2.2 9.68 2.2 8.8 V3.8 C2.2 2.92 2.92 2.2 3.8 2.2 H8.8 C9.68 2.2 10.4 2.92 10.4 3.8 V5.6" />
    <!-- 前页卡片 -->
    <rect class="sheet-front" x="5.6" y="5.6" width="8.2" height="8.2" rx="1.6" />
  </g>
</svg>