<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .sub-chev {
      stroke: #6b7280;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.18s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .sub-chev,
    svg.is-open .sub-chev {
      stroke: #111827;
      transform: translateX(1.5px);
    }
    svg:active .sub-chev {
      stroke: #2563eb;
      transform: translateX(2px) scale(0.91);
    }
  </style>

  <path class="sub-chev" d="M5.75 3.6 L10.15 8 L5.75 12.4" />
</svg>
