<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .sp-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .sp-bg {
      fill: #6b7280;
      fill-opacity: 0;
      transition: fill-opacity 0.2s ease;
    }
    .sp-ring {
      stroke: #6b7280;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-dasharray: 2.9 3.174;
      stroke-dashoffset: 4.48;
      transform-origin: 8px 8px;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    .sp-dot {
      fill: #9ca3af;
      transform-origin: 8px 8px;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), fill 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .sp-bg {
      fill-opacity: 0.1;
    }
    svg:hover .sp-ring {
      stroke: #374151;
      transform: rotate(30deg);
    }
    svg:hover .sp-dot {
      fill: #374151;
      transform: scale(1.22);
    }

    svg:active .sp-root {
      transform: scale(0.91);
    }
    svg:active .sp-bg {
      fill-opacity: 0.16;
    }
    svg:active .sp-ring {
      stroke: #111827;
    }
    svg:active .sp-dot {
      fill: #111827;
      transform: scale(0.95);
    }
  </style>

  <g class="sp-root">
    <!-- 悬停轻底纹 -->
    <circle class="sp-bg" cx="8" cy="8" r="5.8" />
    <!-- 六段对称虚线环（与 check.svg 11.6px 外径一致） -->
    <circle class="sp-ring" cx="8" cy="8" r="5.8" />
    <!-- 视觉重心锚点 -->
    <circle class="sp-dot" cx="8" cy="8" r="1.15" />
  </g>
</svg>