<svg class="tg-icon tg-icon--create-range" viewBox="0 0 16 16" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .tg-fill {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .tg-sub {
      opacity: 0.72;
      transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    svg:hover .tg-fill { opacity: 0.14; }
    svg:hover .tg-sub { opacity: 1; }
    .tg-plus {
      transform-origin: 8px 8px;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    svg:hover .tg-plus { transform: scale(1.12); stroke: #2563eb; }
  </style>
  <!-- 悬停/按下态选区高亮底纹 -->
  <rect class="tg-fill" x="2.75" y="3.5" width="10.5" height="9" rx="0.5" fill="currentColor" />
  <!-- 左右起止时间边界 -->
  <path d="M2 2V14M14 2V14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <!-- 上下框选虚线（手工对称排布，避免 16px 虚线截断失衡） -->
  <path class="tg-sub" d="M4.75 3.5H6.5M9.5 3.5H11.25M4.75 12.5H6.5M9.5 12.5H11.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <!-- 中央新建加号 -->
  <path class="tg-plus" d="M8 6.25V9.75M6.25 8H9.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
</svg>
