<svg class="tg-icon tg-icon--split-all" viewBox="0 0 16 16" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .tg-fill, .tg-src-fill, .tg-dst-fill {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .tg-pane-fill {
      opacity: 0.09;
      transition: opacity 0.2s ease;
    }
    .tg-sub {
      opacity: 0.72;
      transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    svg:hover .tg-fill, svg:hover .tg-src-fill, svg:hover .tg-dst-fill { opacity: 0.14; }
    svg:hover .tg-pane-fill { opacity: 0.2; }
    svg:hover .tg-sub { opacity: 1; }
    .tg-drop { transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease; }
    svg:hover .tg-drop { transform: translateY(0.45px); stroke: #2563eb; }
  </style>
  <!-- 全部区间层（3 条平行横轨，与 delBoundaryAll 同源） -->
  <path class="tg-sub" d="M2 6.25H14M2 9.75H14M2 13.25H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <!-- 播放头标 + 贯通全层同步落边界线 -->
  <g class="tg-drop">
    <path d="M5.75 1.5H10.25L8 4.25Z" fill="currentColor" stroke="currentColor" stroke-width="0.75" stroke-linejoin="round" />
    <path d="M8 3.9V14.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
