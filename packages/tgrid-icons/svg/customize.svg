<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .cust-root {
      transform-origin: 8px 8px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cust-tile {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linejoin: round;
      transition: stroke 0.2s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cust-tile-accent {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linejoin: round;
      fill: rgba(37, 99, 235, 0);
      transform-origin: 11.55px 4.45px;
      transform: translate(0.45px, -0.45px) rotate(14deg);
      transition:
        transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
        stroke 0.2s ease,
        fill 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .cust-tile { stroke: #111827; }
    svg:hover .cust-tile-accent {
      stroke: #2563eb;
      fill: rgba(37, 99, 235, 0.14);
      transform: translate(0, 0) rotate(0deg);
    }
    svg:active .cust-root { transform: scale(0.91); }
  </style>

  <g class="cust-root">
    <rect class="cust-tile" x="2.2" y="2.2" width="4.5" height="4.5" rx="1.05" />
    <rect class="cust-tile" x="2.2" y="9.3" width="4.5" height="4.5" rx="1.05" />
    <rect class="cust-tile" x="9.3" y="9.3" width="4.5" height="4.5" rx="1.05" />
    <rect class="cust-tile-accent" x="9.3" y="2.2" width="4.5" height="4.5" rx="1.05" />
  </g>
</svg>
