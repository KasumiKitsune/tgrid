<svg class="tg-icon tg-icon--replace" viewBox="0 0 16 16" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .tg-fill, .tg-src-fill, .tg-dst-fill {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .tg-pane-fill {
      opacity: 0.09;
      transition: opacity 0.2s ease;
    }
    .tg-sub {
      opacity: 0.72;
      transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    svg:hover .tg-fill, svg:hover .tg-src-fill, svg:hover .tg-dst-fill { opacity: 0.14; }
    svg:hover .tg-pane-fill { opacity: 0.2; }
    svg:hover .tg-sub { opacity: 1; }
    .tg-rep-tr { transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease; }
    svg:hover .tg-rep-tr { transform: translate(0.45px, -0.35px); stroke: #2563eb; }
    svg:hover .tg-rep-bl { transform: translate(-0.45px, 0.35px); }
  </style>
  <!-- 左上：匹配源项（空心框） -->
  <rect class="tg-src-fill" x="1.75" y="1.75" width="5.25" height="5.25" rx="1.2" fill="currentColor" />
  <rect x="1.75" y="1.75" width="5.25" height="5.25" rx="1.2" stroke="currentColor" stroke-width="1.5" />
  <!-- 右下：替换目标项（默认淡实心区分新旧） -->
  <rect class="tg-dst-fill" x="9" y="9" width="5.25" height="5.25" rx="1.2" fill="currentColor" />
  <rect x="9" y="9" width="5.25" height="5.25" rx="1.2" stroke="currentColor" stroke-width="1.5" />
  <!-- 右上主替换箭头 & 左下平衡箭头 -->
  <path class="tg-rep-tr" d="M9.5 2.75H11.25C12.22 2.75 13 3.53 13 4.5V6.25M11.65 4.85L13 6.25L14.35 4.85" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="tg-sub tg-rep-bl" d="M6.5 13.25H4.75C3.78 13.25 3 12.47 3 11.5V9.75M1.65 11.15L3 9.75L4.35 11.15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
