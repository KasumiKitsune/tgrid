<svg class="tg-icon tg-icon--nudge-shared" viewBox="0 0 16 16" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .tg-fill, .tg-src-fill, .tg-dst-fill {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .tg-pane-fill {
      opacity: 0.09;
      transition: opacity 0.2s ease;
    }
    .tg-sub {
      opacity: 0.72;
      transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    svg:hover .tg-fill, svg:hover .tg-src-fill, svg:hover .tg-dst-fill { opacity: 0.14; }
    svg:hover .tg-pane-fill { opacity: 0.2; }
    svg:hover .tg-sub { opacity: 1; }
    svg:hover .tg-arr-l { transform: translateX(-0.6px); }
    svg:hover .tg-arr-r { transform: translateX(0.6px); }
  </style>
  <!-- 按下态跨层联动轴高亮带 -->
  <rect class="tg-fill" x="6.5" y="2" width="3" height="12" rx="1" fill="currentColor" />
  <!-- 上 / 下跨层水平轨道 -->
  <path class="tg-sub" d="M2 3H14M2 13H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <!-- 贯穿多层的对齐纵边界 -->
  <path d="M8 1.5V14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <!-- 左 / 右联动平移箭头 -->
  <path class="tg-sub tg-arr-l" d="M5.5 8H1.75M3.5 6.25L1.75 8L3.5 9.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="tg-sub tg-arr-r" d="M10.5 8H14.25M12.5 6.25L14.25 8L12.5 9.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
