<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .layers-root {
      transform-origin: 8px 8px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tier-top, .tier-bottom {
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .frame {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }
    .accent-stroke {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linecap: round;
      transition: stroke 0.2s ease;
    }
    .accent-fill {
      fill: #374151;
      stroke: #374151;
      stroke-width: 1;
      stroke-linejoin: round;
      transition: fill 0.2s ease, stroke 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .tier-top { transform: translateY(-0.75px); }
    svg:hover .tier-bottom { transform: translateY(0.75px); }
    svg:hover .frame { stroke: #111827; }
    svg:hover .accent-stroke { stroke: #2563eb; }
    svg:hover .accent-fill { fill: #2563eb; stroke: #2563eb; }
    svg:active .layers-root { transform: scale(0.91); }
  </style>

  <g class="layers-root">
    <!-- 上层：区间层 (IntervalTier) -->
    <g class="tier-top">
      <rect class="frame" x="2.2" y="2.8" width="11.6" height="4.5" rx="1.2" />
      <path class="accent-stroke" d="M6.6 2.8 V7.3" />
    </g>
    <!-- 下层：点层 (PointTier) -->
    <g class="tier-bottom">
      <path class="frame" d="M2.2 11.4 H6.4 M10.6 11.4 H13.8" />
      <path class="accent-fill" d="M8.5 9.6 L10.3 11.4 L8.5 13.2 L6.7 11.4 Z" />
    </g>
  </g>
</svg>