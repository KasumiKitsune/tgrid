<svg class="tg-icon tg-icon--toggle-scale" viewBox="0 0 16 16" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .tg-fill {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .tg-sub {
      opacity: 0.72;
      transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    svg:hover .tg-fill { opacity: 0.14; }
    svg:hover .tg-sub { opacity: 1; }
    .tg-head-l, .tg-head-r {
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    svg:hover .tg-head-l { transform: translateX(-0.65px); stroke: #2563eb; }
    svg:hover .tg-head-r { transform: translateX(0.65px); stroke: #2563eb; }
  </style>
  <!-- 上方：线性物理时长均等刻度尺 -->
  <path class="tg-sub" d="M2 3.75H14M2 2V5.5M14 2V5.5M6 2.5V5M10 2.5V5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <!-- 下方：自适应宽度双向拉伸箭头 -->
  <g class="tg-stretch">
    <path d="M2.5 11.75H13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    <path class="tg-head-l" d="M4.75 9.5L2.25 11.75L4.75 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path class="tg-head-r" d="M11.25 9.5L13.75 11.75L11.25 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
