<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .fp-root {
      transform-origin: 8px 8px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .fp-head {
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .fp-cap {
      fill: #374151;
      stroke: #374151;
      stroke-width: 0.75;
      stroke-linejoin: round;
      transition: fill 0.2s ease, stroke 0.2s ease;
    }
    .fp-stem {
      stroke: #374151;
      stroke-width: 1.5;
      stroke-linecap: round;
      transition: stroke 0.2s ease;
    }
    .fp-track {
      stroke: #374151;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .fp-head {
      transform: translateX(0.85px);
    }
    svg:hover .fp-cap {
      fill: #2563eb;
      stroke: #2563eb;
    }
    svg:hover .fp-stem {
      stroke: #2563eb;
    }
    svg:hover .fp-track {
      stroke: #111827;
      transform: translateX(0.85px);
    }
    svg:active .fp-root { transform: scale(0.91); }
  </style>

  <g class="fp-root">
    <!-- 视窗横向跟随轨迹（左侧尾迹 + 右侧推进箭头，留出光学断口） -->
    <g class="fp-track">
      <path d="M1.85 9.35 H3.1" />
      <path d="M7.6 9.35 H13.45" />
      <path d="M11.15 7.05 L13.45 9.35 L11.15 11.65" />
    </g>
    <!-- T·Grid 标志性播放头标与纵线 -->
    <g class="fp-head">
      <path class="fp-cap" d="M3.2 1.85 H7.5 L5.35 4.65 Z" />
      <path class="fp-stem" d="M5.35 4.25 V14.15" />
    </g>
  </g>
</svg>
