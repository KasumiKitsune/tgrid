<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .cp-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cp-front {
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cp-card {
      stroke: #374151;
      stroke-width: 1.4;
      fill: rgba(37, 99, 235, 0);
      transition: stroke 0.2s ease, fill 0.2s ease;
    }
    .cp-chev {
      stroke: #374151;
      stroke-width: 1.55;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    .cp-stack {
      stroke: #6b7280;
      stroke-width: 1.35;
      stroke-linecap: round;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .cp-front {
      transform: translateX(-0.45px);
    }
    svg:hover .cp-card {
      stroke: #111827;
      fill: rgba(37, 99, 235, 0.08);
    }
    svg:hover .cp-chev {
      stroke: #2563eb;
      transform: translateX(-0.5px);
    }
    svg:hover .cp-stack {
      stroke: #4b5563;
      transform: translateX(0.35px);
    }

    svg:active .cp-root {
      transform: scale(0.91);
    }
    svg:active .cp-front {
      transform: translateX(-0.7px);
    }
    svg:active .cp-card {
      stroke: #2563eb;
      fill: rgba(37, 99, 235, 0.14);
    }
    svg:active .cp-chev {
      stroke: #2563eb;
      transform: translateX(-0.7px);
    }
    svg:active .cp-stack {
      stroke: #6b7280;
      transform: translateX(0.5px);
    }
  </style>

  <g class="cp-root">
    <!-- 右侧叠放词条队列边缘（提供前后词条叠层语境） -->
    <path class="cp-stack" d="M13.3 4.5 C13.62 4.76 13.8 5.18 13.8 5.65 V10.35 C13.8 10.82 13.62 11.24 13.3 11.5" />
    <!-- 左侧当前切入词条卡与方向尖角 -->
    <g class="cp-front">
      <rect class="cp-card" x="2.2" y="2.8" width="9" height="10.4" rx="1.6" />
      <path class="cp-chev" d="M7.75 5.65 L5.35 8 L7.75 10.35" />
    </g>
  </g>
</svg>