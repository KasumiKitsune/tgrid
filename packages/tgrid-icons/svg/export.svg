<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .export-root {
      transform-origin: 8px 8px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .arrow {
      stroke: #374151;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    .tray {
      stroke: #374151;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .arrow {
      stroke: #2563eb;
      transform: translateY(1.2px);
    }
    svg:hover .tray {
      stroke: #111827;
      transform: translateY(0.35px);
    }
    svg:active .export-root {
      transform: scale(0.91);
    }
  </style>

  <g class="export-root">
    <!-- 落入箭头 -->
    <g class="arrow">
      <path d="M8 2.4 V9.8" />
      <path d="M5.2 7.2 L8 10 L10.8 7.2" />
    </g>
    <!-- 承接托盘 -->
    <path class="tray" d="M2.6 10.6 V12.1 C2.6 12.8 3.2 13.4 3.9 13.4 H12.1 C12.8 13.4 13.4 12.8 13.4 12.1 V10.6" />
  </g>
</svg>