<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .as-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .as-sil {
      stroke: #9ca3af;
      stroke-width: 1.3;
      stroke-linecap: round;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    .as-bar {
      stroke: #374151;
      stroke-width: 1.35;
      stroke-linecap: round;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), stroke 0.2s ease;
    }
    .as-b1 { transform-origin: 5.9px 5px; transition-delay: 0ms; }
    .as-b2 { transform-origin: 8px 5px; transition-delay: 35ms; }
    .as-b3 { transform-origin: 10.1px 5px; transition-delay: 70ms; }
    .as-seg-fill {
      fill: rgba(37, 99, 235, 0);
      transition: fill 0.2s ease;
    }
    .as-tier {
      stroke: #374151;
      stroke-width: 1.35;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }
    .as-blade {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    .as-blade-l { transform-origin: 4.8px 11.4px; }
    .as-blade-r { transform-origin: 11.2px 11.4px; }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .as-sil {
      stroke: #6b7280;
    }
    svg:hover .as-sil-l { transform: translateX(-0.35px); }
    svg:hover .as-sil-r { transform: translateX(0.35px); }
    svg:hover .as-bar {
      stroke: #2563eb;
    }
    svg:hover .as-b1 { transform: scaleY(1.2); }
    svg:hover .as-b2 { transform: scaleY(1.1); }
    svg:hover .as-b3 { transform: scaleY(1.16); }
    svg:hover .as-tier {
      stroke: #111827;
    }
    svg:hover .as-seg-fill {
      fill: rgba(37, 99, 235, 0.12);
    }
    svg:hover .as-blade {
      stroke: #2563eb;
    }
    svg:hover .as-blade-l { transform: scaleY(1.1); }
    svg:hover .as-blade-r { transform: scaleY(1.1); }

    svg:active .as-root {
      transform: scale(0.91);
    }
    svg:active .as-seg-fill {
      fill: rgba(37, 99, 235, 0.14);
    }
    svg:active .as-blade-l {
      transform: translateX(0.25px) scaleY(1.06);
    }
    svg:active .as-blade-r {
      transform: translateX(-0.25px) scaleY(1.06);
    }
  </style>

  <g class="as-root">
    <!-- 上半部：前后静音平线与中央语音声波 -->
    <path class="as-sil as-sil-l" d="M2.2 5 H3.4" />
    <path class="as-sil as-sil-r" d="M12.6 5 H13.8" />
    <path class="as-bar as-b1" d="M5.9 4 V6" />
    <path class="as-bar as-b2" d="M8 2.8 V7.2" />
    <path class="as-bar as-b3" d="M10.1 3.7 V6.3" />

    <!-- 下半部：TextGrid 区间层与静音/语音双切分边界 -->
    <rect class="as-seg-fill" x="4.8" y="9.8" width="6.4" height="3.7" />
    <rect class="as-tier" x="2.1" y="9.8" width="11.8" height="3.7" rx="0.95" />
    <path class="as-blade as-blade-l" d="M4.8 9 V13.8" />
    <path class="as-blade as-blade-r" d="M11.2 9 V13.8" />
  </g>
</svg>