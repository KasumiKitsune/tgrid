<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .clr-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .eraser-group {
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .eraser-grip {
      fill: rgba(55, 65, 81, 0.08);
      transition: fill 0.2s ease;
    }
    .eraser-stroke {
      stroke: #374151;
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }
    .trace-line {
      stroke: #9ca3af;
      stroke-width: 1.3;
      stroke-linecap: round;
      transform-origin: 13.8px 12.6px;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .eraser-group { transform: translateX(-0.9px); }
    svg:hover .eraser-stroke { stroke: #2563eb; }
    svg:hover .eraser-grip { fill: rgba(37, 99, 235, 0.14); }
    svg:hover .trace-line { opacity: 0.35; transform: scaleX(0.68); }
    svg:active .clr-root { transform: scale(0.91); }
  </style>

  <g class="clr-root">
    <!-- 右侧待擦除残迹线 -->
    <path class="trace-line" d="M7.2 12.6 H13.8" />
    <!-- 45° 精密斜握橡皮擦 -->
    <g class="eraser-group">
      <!-- 握柄淡色层次 -->
      <path class="eraser-grip" d="M5 6.9 L8.2 3.7 C8.55 3.35 9.12 3.35 9.47 3.7 L12.1 6.33 C12.45 6.68 12.45 7.25 12.1 7.6 L8.8 10.9 Z" />
      <!-- 主体轮廓与黄金分割腰线 -->
      <path class="eraser-stroke" d="M5.1 12.6 L2.55 10.05 C2.15 9.65 2.15 9 2.55 8.6 L8.15 3 C8.55 2.6 9.2 2.6 9.6 3 L12.35 5.75 C12.75 6.15 12.75 6.8 12.35 7.2 L7.1 12.6 Z" />
      <path class="eraser-stroke" d="M5 6.7 L8.9 10.6" />
    </g>
  </g>
</svg>