<svg class="tg-icon tg-icon--seek-back" viewBox="0 0 16 16" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .tg-fill, .tg-src-fill, .tg-dst-fill {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .tg-pane-fill {
      opacity: 0.09;
      transition: opacity 0.2s ease;
    }
    .tg-sub {
      opacity: 0.72;
      transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    svg:hover .tg-fill, svg:hover .tg-src-fill, svg:hover .tg-dst-fill { opacity: 0.14; }
    svg:hover .tg-pane-fill { opacity: 0.2; }
    svg:hover .tg-sub { opacity: 1; }
    .tg-step { transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease; }
    svg:hover .tg-step { transform: translateX(-0.65px); stroke: #2563eb; }
  </style>
  <!-- 按下态 100ms 步进扫过轨迹底纹 -->
  <rect class="tg-fill" x="7.5" y="5.25" width="4" height="7.75" rx="0.5" fill="currentColor" />
  <!-- 底部时间轴标尺与等距步长刻度 -->
  <path class="tg-sub" d="M2 13H14M3.5 13V14.25M7.5 13V14.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <!-- 向左步进箭头 -->
  <path class="tg-step" d="M8.25 7.5H2.25M4.5 5.25L2.25 7.5L4.5 9.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- T·Grid 播放头（与 locatePlayhead / splitAllTiers 同源） -->
  <g class="tg-playhead">
    <path d="M9.25 1.75H13.75L11.5 4.5Z" fill="currentColor" stroke="currentColor" stroke-width="0.75" stroke-linejoin="round" />
    <path d="M11.5 4.25V14.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
