<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .dbot-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .base-win {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }
    .dock-tray {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linejoin: round;
      fill: rgba(37, 99, 235, 0);
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease, fill 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .base-win { stroke: #111827; }
    svg:hover .dock-tray {
      stroke: #2563eb;
      fill: rgba(37, 99, 235, 0.12);
      transform: translateY(0.65px);
    }
    svg:active .dbot-root { transform: scale(0.91); }
  </style>

  <g class="dbot-root">
    <!-- 主视口边框（底部避让停靠面板） -->
    <path class="base-win" d="M2 7.5 V4.2 C2 3.32 2.72 2.6 3.6 2.6 H12.4 C13.28 2.6 14 3.32 14 4.2 V7.5" />
    <!-- 底部停靠托盘 -->
    <rect class="dock-tray" x="2" y="9.4" width="12" height="4" rx="1.2" />
  </g>
</svg>
