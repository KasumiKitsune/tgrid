<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .ext-root {
      transform-origin: 8px 8px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .ext-box {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }
    .ext-arrow {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .ext-box { stroke: #111827; }
    svg:hover .ext-arrow {
      stroke: #2563eb;
      transform: translate(0.85px, -0.85px);
    }
    svg:active .ext-root { transform: scale(0.91); }
  </style>

  <g class="ext-root">
    <!-- 视窗外框（右上角留出对称光学断口） -->
    <path class="ext-box" d="M7.15 3.45 H3.65 C2.88 3.45 2.25 4.08 2.25 4.85 V12.35 C2.25 13.12 2.88 13.75 3.65 13.75 H11.15 C11.92 13.75 12.55 13.12 12.55 12.35 V8.85" />
    <!-- 45° 外跳箭头 -->
    <g class="ext-arrow">
      <path d="M7.5 8.5 L13.65 2.35" />
      <path d="M9.85 2.35 H13.65 V6.15" />
    </g>
  </g>
</svg>
