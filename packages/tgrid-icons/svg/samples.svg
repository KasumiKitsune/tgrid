<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .smp-root {
      transform-origin: 8px 8px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .smp-front {
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .smp-card {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linejoin: round;
      fill: rgba(37, 99, 235, 0);
      transition: stroke 0.2s ease, fill 0.2s ease;
    }
    .smp-back {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    .smp-play {
      fill: #374151;
      stroke: #374151;
      stroke-width: 1;
      stroke-linejoin: round;
      transition:
        transform 0.26s cubic-bezier(0.22, 1, 0.36, 1),
        fill 0.2s ease,
        stroke 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .smp-front { transform: translate(-0.25px, 0.25px); }
    svg:hover .smp-card {
      stroke: #111827;
      fill: rgba(37, 99, 235, 0.09);
    }
    svg:hover .smp-back {
      stroke: #2563eb;
      transform: translate(0.55px, -0.55px);
    }
    svg:hover .smp-play {
      fill: #2563eb;
      stroke: #2563eb;
      transform: translateX(0.3px);
    }
    svg:active .smp-root { transform: scale(0.91); }
  </style>

  <g class="smp-root">
    <!-- 后层叠卡（留出建筑制图光学断口） -->
    <path class="smp-back" d="M5.3 2.15 H12.45 C13.2 2.15 13.8 2.75 13.8 3.5 V10.65" />
    <!-- 前景示例语料卡 + 试听标识 -->
    <g class="smp-front">
      <rect class="smp-card" x="2.2" y="4.35" width="9.1" height="9.45" rx="1.4" />
      <path class="smp-play" d="M5.7 7.65 L8.2 9.08 L5.7 10.51 Z" />
    </g>
  </g>
</svg>
