<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .vad-s-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .vad-s-fill {
      fill: rgba(37, 99, 235, 0);
      transform-origin: 1.6px 8.5px;
      transition: fill 0.22s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .vad-s-bar {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linecap: round;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), stroke 0.2s ease;
    }
    .vad-s-b1 { transform-origin: 2.7px 8.5px; transition-delay: 0ms; }
    .vad-s-b2 { transform-origin: 5.1px 8.5px; transition-delay: 35ms; }
    .vad-s-b3 { transform-origin: 7.5px 8.5px; transition-delay: 70ms; }
    .vad-s-scan {
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .vad-s-line {
      stroke: #374151;
      stroke-width: 1.35;
      stroke-linecap: round;
      transition: stroke 0.2s ease;
    }
    .vad-s-pin {
      fill: #374151;
      stroke: #374151;
      stroke-width: 0.8;
      stroke-linejoin: round;
      transition: fill 0.2s ease, stroke 0.2s ease;
    }
    .vad-s-sil {
      stroke: #9ca3af;
      stroke-width: 1.35;
      stroke-linecap: round;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .vad-s-fill {
      fill: rgba(37, 99, 235, 0.12);
      transform: scaleX(1.054);
    }
    svg:hover .vad-s-bar { stroke: #2563eb; }
    svg:hover .vad-s-b1 { transform: scaleY(1.18); }
    svg:hover .vad-s-b2 { transform: scaleY(1.1); }
    svg:hover .vad-s-b3 { transform: scaleY(1.15); }
    svg:hover .vad-s-scan { transform: translateX(0.45px); }
    svg:hover .vad-s-line { stroke: #2563eb; }
    svg:hover .vad-s-pin { fill: #2563eb; stroke: #2563eb; }
    svg:hover .vad-s-sil { stroke: #6b7280; transform: translateX(0.3px); }

    svg:active .vad-s-root { transform: scale(0.91); }
    svg:active .vad-s-fill { fill: rgba(37, 99, 235, 0.14); }
    svg:active .vad-s-scan { transform: translate(0.45px, 0.35px); }
  </style>

  <g class="vad-s-root">
    <!-- 已检出有声段实时预览区 -->
    <rect class="vad-s-fill" x="1.6" y="3.5" width="8.4" height="10" rx="1.1" />

    <!-- 左侧有声声波 -->
    <path class="vad-s-bar vad-s-b1" d="M2.7 6.5 V10.5" />
    <path class="vad-s-bar vad-s-b2" d="M5.1 4.4 V12.6" />
    <path class="vad-s-bar vad-s-b3" d="M7.5 5.7 V11.3" />

    <!-- 有声/静音扫描切分游标 -->
    <g class="vad-s-scan">
      <path class="vad-s-pin" d="M8.85 2.05 H11.15 L10 3.55 Z" />
      <path class="vad-s-line" d="M10 3.4 V13.7" />
    </g>

    <!-- 右侧静音平线 -->
    <path class="vad-s-sil" d="M12.2 8.5 H14" />
  </g>
</svg>
