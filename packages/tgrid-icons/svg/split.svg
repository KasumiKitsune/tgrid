<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .split-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .half {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    .blade {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linecap: round;
      transform-origin: 8px 8px;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .half { stroke: #111827; }
    svg:hover .half-l { transform: translateX(-0.65px); }
    svg:hover .half-r { transform: translateX(0.65px); }
    svg:hover .blade { stroke: #2563eb; transform: scaleY(1.08); }
    svg:active .split-root { transform: scale(0.91); }
  </style>

  <g class="split-root">
    <!-- 左半区间 -->
    <path class="half half-l" d="M5.4 4.3 H3.4 C2.74 4.3 2.2 4.84 2.2 5.5 V10.5 C2.2 11.16 2.74 11.7 3.4 11.7 H5.4" />
    <!-- 右半区间 -->
    <path class="half half-r" d="M10.6 4.3 H12.6 C13.26 4.3 13.8 4.84 13.8 5.5 V10.5 C13.8 11.16 13.26 11.7 12.6 11.7 H10.6" />
    <!-- 中央切分线 -->
    <path class="blade" d="M8 2.2 V13.8" />
  </g>
</svg>