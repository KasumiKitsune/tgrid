<svg class="tg-icon tg-icon--prev-empty" viewBox="0 0 16 16" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .tg-fill, .tg-src-fill, .tg-dst-fill {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .tg-pane-fill {
      opacity: 0.09;
      transition: opacity 0.2s ease;
    }
    .tg-sub {
      opacity: 0.72;
      transition: opacity 0.2s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    svg:hover .tg-fill, svg:hover .tg-src-fill, svg:hover .tg-dst-fill { opacity: 0.14; }
    svg:hover .tg-pane-fill { opacity: 0.2; }
    svg:hover .tg-sub { opacity: 1; }
    .tg-jump { transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease; }
    svg:hover .tg-jump { transform: translateX(-0.65px); stroke: #2563eb; }
  </style>
  <!-- 按下态目标空白区间选中底纹 -->
  <rect class="tg-fill" x="1.75" y="3.5" width="5.5" height="9" rx="1" fill="currentColor" />
  <!-- 左侧四角虚线空白区间 -->
  <path class="tg-sub" d="M1.75 5.75V4.5C1.75 3.95 2.2 3.5 2.75 3.5H3.25M5.75 3.5H6.25C6.8 3.5 7.25 3.95 7.25 4.5V5.75M7.25 10.25V11.5C7.25 12.05 6.8 12.5 6.25 12.5H5.75M3.25 12.5H2.75C2.2 12.5 1.75 12.05 1.75 11.5V10.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- 向左跳转箭头 -->
  <path class="tg-jump" d="M14.25 8H9.75M11.75 6L9.75 8L11.75 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
