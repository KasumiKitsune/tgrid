<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .kb-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .kb-frame {
      stroke: #374151;
      stroke-width: 1.3;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }
    .key {
      fill: #374151;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), fill 0.2s ease;
    }
    .r1 { transition-delay: 0ms; }
    .r2 { transition-delay: 50ms; }
    .r3 { transition-delay: 100ms; }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .kb-frame { stroke: #111827; }
    svg:hover .key {
      fill: #2563eb;
      transform: translateY(0.35px);
    }
    svg:active .kb-root { transform: scale(0.91); }
  </style>

  <g class="kb-root">
    <!-- 键盘圆角外框 -->
    <rect class="kb-frame" x="1.4" y="3.2" width="13.2" height="9.6" rx="1.8" />
    <!-- 第 1 排：4 枚方键 -->
    <rect class="key r1" x="3.55" y="5" width="1.5" height="1.25" rx="0.35" />
    <rect class="key r1" x="6" y="5" width="1.5" height="1.25" rx="0.35" />
    <rect class="key r1" x="8.45" y="5" width="1.5" height="1.25" rx="0.35" />
    <rect class="key r1" x="10.9" y="5" width="1.5" height="1.25" rx="0.35" />
    <!-- 第 2 排：3 枚交错方键 -->
    <rect class="key r2" x="4.75" y="7.4" width="1.5" height="1.25" rx="0.35" />
    <rect class="key r2" x="7.25" y="7.4" width="1.5" height="1.25" rx="0.35" />
    <rect class="key r2" x="9.75" y="7.4" width="1.5" height="1.25" rx="0.35" />
    <!-- 第 3 排：空格键 -->
    <rect class="key r3" x="5.2" y="9.8" width="5.6" height="1.2" rx="0.45" />
  </g>
</svg>