<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .spb-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .spb-blade, .spb-cut {
      transform-origin: 4.8px 11.1px;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .spb-c1 { transform: rotate(0deg); }
    .spb-c2 { transform: rotate(38deg); }
    .spb-c3 { transform: rotate(77deg); }

    .spb-cut {
      fill: #000000;
      stroke: #000000;
      stroke-width: 0.95;
      stroke-linejoin: round;
    }
    .spb-stroke {
      stroke: #374151;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }
    .spb-stroke-accent {
      stroke: #374151;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: rgba(55, 65, 81, 0.06);
      transition: stroke 0.2s ease, fill 0.22s ease;
    }
    .spb-divider {
      stroke: #374151;
      stroke-width: 1.25;
      stroke-linecap: round;
      transition: stroke 0.2s ease;
    }
    .spb-rivet {
      fill: #374151;
      transition: fill 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .spb-c1 { transform: rotate(-3deg); }
    svg:hover .spb-c2 { transform: rotate(45deg); }
    svg:hover .spb-c3 { transform: rotate(88deg); }
    svg:hover .spb-stroke,
    svg:hover .spb-divider { stroke: #111827; }
    svg:hover .spb-stroke-accent {
      stroke: #2563eb;
      fill: rgba(37, 99, 235, 0.14);
    }
    svg:hover .spb-rivet { fill: #2563eb; }
    svg:active .spb-root { transform: scale(0.91); }
  </style>

  <defs>
    <!-- 动态遮罩：前叶遮挡中叶 -->
    <mask id="spb-mask-c1" maskUnits="userSpaceOnUse" x="0" y="0" width="16" height="16">
      <rect width="16" height="16" fill="#ffffff" />
      <path class="spb-cut spb-c1" d="M2.5 3.8 A1.1 1.1 0 0 1 3.6 2.7 H6 A1.1 1.1 0 0 1 7.1 3.8 V11.1 A2.3 2.3 0 0 1 2.5 11.1 Z" />
    </mask>
    <!-- 动态遮罩：前叶与中叶共同遮挡底叶 -->
    <mask id="spb-mask-c12" maskUnits="userSpaceOnUse" x="0" y="0" width="16" height="16">
      <rect width="16" height="16" fill="#ffffff" />
      <path class="spb-cut spb-c1" d="M2.5 3.8 A1.1 1.1 0 0 1 3.6 2.7 H6 A1.1 1.1 0 0 1 7.1 3.8 V11.1 A2.3 2.3 0 0 1 2.5 11.1 Z" />
      <path class="spb-cut spb-c2" d="M2.5 3.8 A1.1 1.1 0 0 1 3.6 2.7 H6 A1.1 1.1 0 0 1 7.1 3.8 V11.1 A2.3 2.3 0 0 1 2.5 11.1 Z" />
    </mask>
  </defs>

  <g class="spb-root">
    <!-- 后层色卡 -->
    <g mask="url(#spb-mask-c12)">
      <g class="spb-blade spb-c3">
        <path class="spb-stroke" d="M2.5 3.8 A1.1 1.1 0 0 1 3.6 2.7 H6 A1.1 1.1 0 0 1 7.1 3.8 V11.1 A2.3 2.3 0 0 1 2.5 11.1 Z" />
      </g>
    </g>
    <!-- 中层主角色卡 -->
    <g mask="url(#spb-mask-c1)">
      <g class="spb-blade spb-c2">
        <path class="spb-stroke-accent" d="M2.5 3.8 A1.1 1.1 0 0 1 3.6 2.7 H6 A1.1 1.1 0 0 1 7.1 3.8 V11.1 A2.3 2.3 0 0 1 2.5 11.1 Z" />
      </g>
    </g>
    <!-- 前层主色卡 + 色块分割线 + 轴心铆钉 -->
    <g class="spb-blade spb-c1">
      <path class="spb-stroke" d="M2.5 3.8 A1.1 1.1 0 0 1 3.6 2.7 H6 A1.1 1.1 0 0 1 7.1 3.8 V11.1 A2.3 2.3 0 0 1 2.5 11.1 Z" />
      <path class="spb-divider" d="M2.6 7.2 H7" />
      <circle class="spb-rivet" cx="4.8" cy="11.1" r="0.88" />
    </g>
  </g>
</svg>
