<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .inf-root {
      transform-origin: 8px 8px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .inf-ring {
      stroke: #374151;
      stroke-width: 1.45;
      fill: rgba(37, 99, 235, 0);
      transition: stroke 0.2s ease, fill 0.2s ease;
    }
    .inf-stem {
      stroke: #374151;
      stroke-width: 1.5;
      stroke-linecap: round;
      transition: stroke 0.2s ease;
    }
    .inf-dot {
      fill: #374151;
      transform-origin: 8px 5.05px;
      transition:
        transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
        fill 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .inf-ring {
      stroke: #111827;
      fill: rgba(37, 99, 235, 0.09);
    }
    svg:hover .inf-stem { stroke: #2563eb; }
    svg:hover .inf-dot {
      fill: #2563eb;
      transform: translateY(-0.4px) scale(1.12);
    }
    svg:active .inf-root { transform: scale(0.91); }
  </style>

  <g class="inf-root">
    <!-- 标准 12px 直径外圆环 -->
    <circle class="inf-ring" cx="8" cy="8" r="6" />
    <!-- 信息字母 i -->
    <circle class="inf-dot" cx="8" cy="5.05" r="0.82" />
    <path class="inf-stem" d="M8 7.6 V11.1" />
  </g>
</svg>
