<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .loop-press {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .loop-spin {
      transform-origin: 8px 8px;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .loop-path {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }
    svg { cursor: pointer; overflow: visible; }
    svg:hover .loop-spin { transform: rotate(180deg); }
    svg:hover .loop-path { stroke: #2563eb; }
    svg:active .loop-press { transform: scale(0.9); }
  </style>

  <g class="loop-press">
    <g class="loop-spin">
      <!-- 上半循环弧 + 箭头 -->
      <path class="loop-path" d="M2.4 7.4 V6 C2.4 4.78 3.38 3.8 4.6 3.8 H12.6" />
      <path class="loop-path" d="M10.6 2 L12.7 3.8 L10.6 5.6" />
      <!-- 下半循环弧 + 箭头 -->
      <path class="loop-path" d="M13.6 8.6 V10 C13.6 11.22 12.62 12.2 11.4 12.2 H3.4" />
      <path class="loop-path" d="M5.4 14 L3.3 12.2 L5.4 10.4" />
    </g>
  </g>
</svg>