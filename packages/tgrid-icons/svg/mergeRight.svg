<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .mr-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .slot {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }
    .arrow {
      stroke: #374151;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .slot { stroke: #111827; }
    svg:hover .arrow {
      stroke: #2563eb;
      transform: translateX(1.1px);
    }
    svg:active .mr-root { transform: scale(0.91); }
  </style>

  <g class="mr-root">
    <!-- 右侧承接区间槽 -->
    <path class="slot" d="M9.6 3.4 H12.3 C13.13 3.4 13.8 4.07 13.8 4.9 V11.1 C13.8 11.93 13.13 12.6 12.3 12.6 H9.6" />
    <!-- 向右并入箭头 -->
    <g class="arrow">
      <path d="M2.2 8 H9.8" />
      <path d="M7.3 5.5 L9.9 8 L7.3 10.5" />
    </g>
  </g>
</svg>