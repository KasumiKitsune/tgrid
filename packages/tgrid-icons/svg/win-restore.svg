<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .win-root {
      transform-origin: 8px 8px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .win-back, .win-front {
      stroke: #4b5563;
      stroke-width: 1.55;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.2s ease;
    }
    svg { cursor: pointer; overflow: visible; }
    svg:hover .win-back {
      stroke: #111827;
      transform: translate(0.5px, -0.5px);
    }
    svg:hover .win-front {
      stroke: #111827;
      transform: translate(-0.4px, 0.4px);
    }
    svg:active .win-root {
      transform: scale(0.9);
    }
  </style>

  <g class="win-root">
    <!-- 后层窗口轮廓 -->
    <path class="win-back" d="M5.6 4.8 V4.2 C5.6 3.3 6.3 2.6 7.2 2.6 H11.8 C12.7 2.6 13.4 3.3 13.4 4.2 V8.8 C13.4 9.7 12.7 10.4 11.8 10.4 H11.2" />
    <!-- 前层主窗口 -->
    <rect class="win-front" x="2.6" y="5.4" width="8" height="8" rx="1.6" />
  </g>
</svg>