<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none">
  <style>
    .zc-root {
      transform-origin: 8px 8px;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .zero-axis {
      stroke: #9ca3af;
      stroke-width: 1;
      stroke-linecap: round;
      transition: stroke 0.22s ease;
    }
    .sine {
      stroke: #374151;
      stroke-width: 1.4;
      stroke-linecap: round;
      transition: stroke 0.2s ease;
    }
    .ring {
      stroke: #374151;
      stroke-width: 1.35;
      transform-origin: 8px 8px;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), stroke 0.2s ease;
    }
    .ring-cut {
      fill: #000000;
      transform-origin: 8px 8px;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .lock-core {
      fill: #2563eb;
      opacity: 0;
      transform-origin: 8px 8px;
      transform: scale(0.2);
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
    }

    svg { cursor: pointer; overflow: visible; }
    svg:hover .zero-axis { stroke: #6b7280; }
    svg:hover .sine { stroke: #111827; }
    svg:hover .ring { stroke: #2563eb; transform: scale(1.15); }
    svg:hover .ring-cut { transform: scale(1.15); }
    svg:hover .lock-core { opacity: 1; transform: scale(1); }
    svg:active .zc-root { transform: scale(0.91); }
  </style>

  <defs>
    <mask id="zc-center-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="16" height="16">
      <rect width="16" height="16" fill="#ffffff" />
      <circle class="ring-cut" cx="8" cy="8" r="2.15" />
    </mask>
  </defs>

  <g class="zc-root">
    <g mask="url(#zc-center-mask)">
      <path class="zero-axis" d="M1.8 8 H14.2" />
      <path class="sine" d="M2.2 4.8 C4.1 2.2 6.2 4.3 8 8 C9.8 11.7 11.9 13.8 13.8 11.2" />
    </g>
    <circle class="ring" cx="8" cy="8" r="1.85" />
    <circle class="lock-core" cx="8" cy="8" r="0.72" />
  </g>
</svg>
