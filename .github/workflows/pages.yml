name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build:all-web
      - name: Stage Pages output (multi-file web + downloadable singlefile HTML)
        run: |
          mkdir -p _site
          cp -r apps/web/dist/* _site/
          cp apps/web/dist-singlefile/index.html _site/tgrid-standalone.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow (Bing / Yandex)
        continue-on-error: true
        run: |
          sleep 15
          curl -fsS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "kasumikitsune.github.io",
              "key": "c8a4f19d6b3e4720a5d2e8b19c6f3a04",
              "keyLocation": "https://kasumikitsune.github.io/tgrid/c8a4f19d6b3e4720a5d2e8b19c6f3a04.txt",
              "urlList": [
                "https://kasumikitsune.github.io/tgrid/",
                "https://kasumikitsune.github.io/tgrid/guide.html"
              ]
            }'
