<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 248" width="820" height="248" role="img" aria-label="双尺折行标注图纵向结构示意图">
  <defs>
    <style>
      .card { fill: #FAF9F6; stroke: #D6D2C8; stroke-width: 1; }
      .box { fill: #FFFFFF; stroke: #C6C2B8; stroke-width: 1; }
      .box-muted { fill: #F2F0EA; stroke: #C6C2B8; stroke-width: 1; }
      .silence { fill: #EFECE4; stroke: #C6C2B8; stroke-width: 1; }
      .ink { fill: #1C1B18; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .muted { fill: #6B675E; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { fill: #2E2C27; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .mono-dim { fill: #9A958A; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .ipa { fill: #1C1B18; font-family: "Charis SIL", "Doulos SIL", "Segoe UI", "PingFang SC", sans-serif; }
      .line-major { stroke: #4A4842; stroke-width: 1.15; }
      .line-minor { stroke: #A39E93; stroke-width: 0.85; }
      .tick-line { stroke: #3F3D38; stroke-width: 1; }
      .callout-line { stroke: #C6C2B8; stroke-width: 1; stroke-dasharray: 2 2; }
    </style>
  </defs>

  <!-- Outer Paper Card -->
  <rect class="card" x="0.5" y="0.5" width="819" height="247" rx="6" />

  <!-- Subtle Header -->
  <text class="muted" x="20" y="23" font-size="11" font-weight="600">双尺折行标注图 · 单折行纵向结构</text>
  <text class="muted" x="624" y="23" font-size="10.5" text-anchor="end">上方：1:1 真实物理时间</text>

  <!-- ==================== 1. 1:1 TRUE-TIME STRIP (y: 34..54) ==================== -->
  <rect class="box-muted" x="104" y="34" width="520" height="20" />
  <rect x="132" y="34.5" width="22" height="19" fill="#1D4ED8" opacity="0.18" />
  <rect x="154" y="34.5" width="58" height="19" fill="#DEDAD0" />
  <rect x="212" y="34.5" width="56" height="19" fill="#EAE6DC" />
  <rect x="268" y="34.5" width="66" height="19" fill="#DEDAD0" />
  <rect x="334" y="34.5" width="64" height="19" fill="#EAE6DC" />
  <rect class="silence" x="470" y="34" width="48" height="20" />
  <text class="mono" x="494" y="48" font-size="10.5" text-anchor="middle">//</text>
  <rect x="518" y="34.5" width="48" height="19" fill="#DEDAD0" />
  <rect x="566" y="34.5" width="58" height="19" fill="#EAE6DC" />
  <g stroke="#5C5850" stroke-width="0.95">
    <line x1="132" y1="34" x2="132" y2="54" />
    <line x1="154" y1="34" x2="154" y2="54" />
    <line x1="212" y1="34" x2="212" y2="54" />
    <line x1="268" y1="34" x2="268" y2="54" />
    <line x1="334" y1="34" x2="334" y2="54" />
    <line x1="398" y1="34" x2="398" y2="54" />
    <line x1="566" y1="34" x2="566" y2="54" />
  </g>
  <text class="muted" x="96" y="48" font-size="10.5" text-anchor="end">真时间 1:1</text>

  <!-- ==================== 2. STRAIGHT PROJECTION BRIDGE (y: 54..90) ==================== -->
  <!-- Highlighted straight trapezoid for short phoneme [132..154] -> [136..196] -->
  <polygon points="132,54 154,54 196,90 136,90" fill="#1D4ED8" opacity="0.14" />
  <line class="line-major" x1="104" y1="54" x2="104" y2="90" />
  <line x1="132" y1="54" x2="136" y2="90" stroke="#1D4ED8" stroke-width="1.35" />
  <line x1="154" y1="54" x2="196" y2="90" stroke="#1D4ED8" stroke-width="1.35" />
  <line class="line-minor" x1="212" y1="54" x2="256" y2="90" />
  <line class="line-major" x1="268" y1="54" x2="306" y2="90" />
  <line class="line-minor" x1="334" y1="54" x2="366" y2="90" />
  <line class="line-major" x1="398" y1="54" x2="422" y2="90" />
  <line class="line-major" x1="470" y1="54" x2="470" y2="90" />
  <line class="line-major" x1="518" y1="54" x2="518" y2="90" />
  <line class="line-minor" x1="566" y1="54" x2="570" y2="90" />
  <line class="line-major" x1="624" y1="54" x2="624" y2="90" />

  <!-- ==================== 3. SHARED TIME AXIS (y: 90..126) ==================== -->
  <line x1="104" y1="126" x2="624" y2="126" stroke="#B5B0A4" stroke-width="1" />
  <text class="muted" x="96" y="125" font-size="10" text-anchor="end">时间 (s)</text>
  <g font-size="9.5">
    <line class="tick-line" x1="104" y1="121" x2="104" y2="127" />
    <text class="mono" transform="translate(107,119) rotate(-50)">0</text>
    <line class="tick-line" x1="136" y1="121" x2="136" y2="127" />
    <text class="mono" transform="translate(139,119) rotate(-50)">0.24</text>
    <line class="tick-line" x1="196" y1="121" x2="196" y2="127" />
    <text class="mono" transform="translate(199,119) rotate(-50)">0.31</text>
    <line class="tick-line" x1="256" y1="121" x2="256" y2="127" />
    <text class="mono" transform="translate(259,119) rotate(-50)">0.56</text>
    <line class="tick-line" x1="306" y1="121" x2="306" y2="127" />
    <text class="mono" transform="translate(309,119) rotate(-50)">0.88</text>
    <line class="tick-line" x1="366" y1="121" x2="366" y2="127" />
    <text class="mono" transform="translate(369,119) rotate(-50)">1.12</text>
    <line class="tick-line" x1="422" y1="121" x2="422" y2="127" />
    <text class="mono" transform="translate(425,119) rotate(-50)">1.45</text>
    <line class="tick-line" x1="470" y1="121" x2="470" y2="127" />
    <text class="mono" transform="translate(473,119) rotate(-50)">1.62</text>
    <line class="tick-line" x1="518" y1="121" x2="518" y2="127" />
    <text class="mono" transform="translate(521,119) rotate(-50)">4.20</text>
    <line class="tick-line" x1="570" y1="121" x2="570" y2="127" />
    <text class="mono" transform="translate(573,119) rotate(-50)">4.55</text>
    <line class="tick-line" x1="624" y1="121" x2="624" y2="127" />
    <text class="mono" transform="translate(627,119) rotate(-50)">4.80</text>
  </g>

  <!-- ==================== 4. MULTI-TIER ANNOTATION AREA (y: 134..204) ==================== -->
  <!-- Tier 1: 词语 (y: 134..164) -->
  <text class="muted" x="26" y="153" font-size="11" text-anchor="end">1</text>
  <rect x="34" y="144" width="12" height="9" rx="1.5" fill="none" stroke="#6B675E" stroke-width="1.1" />
  <line x1="40" y1="144" x2="40" y2="153" stroke="#6B675E" stroke-width="1.1" />
  <text class="ink" x="52" y="153" font-size="11.5" font-weight="500">词语</text>

  <rect class="box-muted" x="104" y="134" width="32" height="30" />
  <rect class="box" x="136" y="134" width="170" height="30" />
  <line x1="136" y1="135" x2="306" y2="135" stroke="#3B82F6" stroke-width="2" opacity="0.65" />
  <text class="ink" x="221" y="153" font-size="12.5" text-anchor="middle">春眠</text>
  <rect class="box" x="306" y="134" width="116" height="30" />
  <line x1="306" y1="135" x2="422" y2="135" stroke="#3B82F6" stroke-width="2" opacity="0.65" />
  <text class="ink" x="364" y="153" font-size="12.5" text-anchor="middle">不觉晓</text>
  <rect class="box-muted" x="422" y="134" width="48" height="30" />
  <rect class="silence" x="470" y="134" width="48" height="30" />
  <text class="mono-dim" x="494" y="153" font-size="11" text-anchor="middle">//</text>
  <rect class="box" x="518" y="134" width="106" height="30" />
  <line x1="518" y1="135" x2="624" y2="135" stroke="#3B82F6" stroke-width="2" opacity="0.65" />
  <text class="ink" x="571" y="153" font-size="12.5" text-anchor="middle">处处</text>

  <!-- Tier 2: 音素 (y: 172..202) -->
  <text class="muted" x="26" y="191" font-size="11" text-anchor="end">2</text>
  <rect x="34" y="182" width="12" height="9" rx="1.5" fill="none" stroke="#6B675E" stroke-width="1.1" />
  <line x1="40" y1="182" x2="40" y2="191" stroke="#6B675E" stroke-width="1.1" />
  <text class="ink" x="52" y="191" font-size="11.5" font-weight="500">音素</text>

  <rect class="box-muted" x="104" y="172" width="32" height="30" />
  <!-- Selected stretched interval -->
  <rect x="136" y="172" width="60" height="30" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.4" />
  <line x1="138" y1="200" x2="194" y2="200" stroke="#D97706" stroke-width="2" stroke-dasharray="3 2" />
  <text class="ipa" x="166" y="191" font-size="12.5" text-anchor="middle">tʂʰ</text>

  <rect class="box" x="196" y="172" width="60" height="30" />
  <text class="ipa" x="226" y="191" font-size="12.5" text-anchor="middle">uən</text>
  <rect class="box" x="256" y="172" width="50" height="30" />
  <text class="ipa" x="281" y="191" font-size="12.5" text-anchor="middle">m</text>
  <rect class="box" x="306" y="172" width="60" height="30" />
  <text class="ipa" x="336" y="191" font-size="12.5" text-anchor="middle">jɛn</text>
  <rect class="box" x="366" y="172" width="56" height="30" />
  <text class="ipa" x="394" y="191" font-size="12.5" text-anchor="middle">pu</text>
  <rect class="box-muted" x="422" y="172" width="48" height="30" />
  <rect class="silence" x="470" y="172" width="48" height="30" />
  <text class="mono-dim" x="494" y="191" font-size="11" text-anchor="middle">//</text>
  <rect class="box" x="518" y="172" width="52" height="30" />
  <text class="ipa" x="544" y="191" font-size="12.5" text-anchor="middle">tʂʰ</text>
  <rect class="box" x="570" y="172" width="54" height="30" />
  <text class="ipa" x="597" y="191" font-size="12.5" text-anchor="middle">u</text>

  <!-- Subtle bottom note -->
  <text class="muted" x="104" y="226" font-size="10.5">下方：自适应可读宽度（长静默 ≥ 0.5 s 上下同步折叠为 //，显著拉伸段带底缘提示）</text>

  <!-- ==================== RIGHT-SIDE ZONE CALLOUTS ==================== -->
  <g font-size="11">
    <line class="callout-line" x1="632" y1="44" x2="672" y2="44" />
    <text class="ink" x="678" y="48" font-weight="500">1. 真实时间比例条</text>

    <line class="callout-line" x1="632" y1="72" x2="672" y2="72" />
    <text class="ink" x="678" y="76" font-weight="500">2. 对齐连线区</text>

    <line class="callout-line" x1="652" y1="112" x2="672" y2="112" />
    <text class="ink" x="678" y="116" font-weight="500">3. 共用时间轴</text>

    <line class="callout-line" x1="632" y1="168" x2="672" y2="168" />
    <text class="ink" x="678" y="172" font-weight="500">4. 多层标注区</text>
  </g>
</svg>
