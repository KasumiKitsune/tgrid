<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 168" width="640" height="168" role="img" aria-label="点层标点先下后上分层遮挡示意图">
  <defs>
    <style>
      .card { fill: #FAF9F6; stroke: #D6D2C8; stroke-width: 1; }
      .ink { fill: #1C1B18; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .muted { fill: #6B675E; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .wire { stroke: #6B675E; stroke-width: 1.4; }
      .leader { stroke: #4A4842; stroke-width: 1.25; }
      .leader-deep { stroke: #8C877C; stroke-width: 1.2; }
      .label-box { fill: #FFFFFF; stroke: #4A4842; stroke-width: 1.2; }
      .label-box-deep { fill: #FFFFFF; stroke: #8C877C; stroke-width: 1.15; }
      .diamond { fill: #1C1B18; }
      .diamond-empty { fill: #FAF9F6; stroke: #1C1B18; stroke-width: 1.3; }
    </style>
  </defs>

  <rect class="card" x="0.5" y="0.5" width="639" height="167" rx="6" />

  <!-- Center Wire -->
  <line class="wire" x1="36" y1="34" x2="430" y2="34" />
  <text class="muted" x="446" y="38" font-size="11">点层中心线（TextTier）</text>

  <!-- STEP 1 (DRAWN FIRST): level = 1 deep point at x = 236 -->
  <line class="leader-deep" x1="236" y1="34" x2="236" y2="112" />
  <rect class="label-box-deep" x="172" y="112" width="128" height="28" rx="3" />
  <text class="ink" x="236" y="130" font-size="11.5" text-anchor="middle">下层标点标签</text>
  <text class="muted" x="446" y="130" font-size="11">level = 1（先画）</text>
  <line x1="306" y1="126" x2="438" y2="126" stroke="#C6C2B8" stroke-width="1" stroke-dasharray="2 2" />

  <!-- STEP 2 (DRAWN SECOND): level = 0 shallow point at x = 114 -->
  <!-- Its opaque white card cleanly covers the deep leader line at x = 236 -->
  <line class="leader" x1="114" y1="34" x2="114" y2="58" />
  <rect class="label-box" x="62" y="58" width="218" height="30" rx="3" />
  <text class="ink" x="171" y="77" font-size="11.5" text-anchor="middle">上层标签框（白底遮盖背后引线）</text>
  <text class="muted" x="446" y="77" font-size="11">level = 0（后画，不穿字）</text>
  <line x1="286" y1="73" x2="438" y2="73" stroke="#C6C2B8" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Diamond anchors on center wire -->
  <polygon class="diamond" points="114,28.5 119.5,34 114,39.5 108.5,34" />
  <polygon class="diamond" points="236,28.5 241.5,34 236,39.5 230.5,34" />
  <!-- Empty point example -->
  <polygon class="diamond-empty" points="376,28.5 381.5,34 376,39.5 370.5,34" />
  <text class="muted" x="376" y="56" font-size="10" text-anchor="middle">空标点 ""</text>

  <!-- Subtle bottom caption -->
  <text class="muted" x="36" y="156" font-size="10">绘制顺序按 level 从大到小：深层引线先入画，浅层不透明标签框后入画，引线从背后自然穿出。</text>
</svg>
