<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="s2-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCFBF7" />
      <stop offset="100%" stop-color="#F0ECE3" />
    </linearGradient>
    <linearGradient id="s2-spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <clipPath id="s2-sheet-clip">
      <path d="M 67 16 H 188 L 232 60 V 235 A 5 5 0 0 1 227 240 H 67 A 5 5 0 0 1 62 235 V 21 A 5 5 0 0 1 67 16 Z" />
    </clipPath>
    <filter id="s2-sheet-shadow" x="-10%" y="-8%" width="122%" height="122%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#141413" flood-opacity="0.14" />
    </filter>
    <filter id="s2-badge-shadow" x="-14%" y="-16%" width="128%" height="142%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.24" />
    </filter>
  </defs>

  <!-- Layer 1: Document sheet silhouette shadow + clipped interior fills -->
  <path d="M 67 16 H 188 L 232 60 V 235 A 5 5 0 0 1 227 240 H 67 A 5 5 0 0 1 62 235 V 21 A 5 5 0 0 1 67 16 Z"
        fill="#FCFBF7" filter="url(#s2-sheet-shadow)" />

  <g clip-path="url(#s2-sheet-clip)">
    <!-- Warm archival paper fill -->
    <rect x="62" y="16" width="170" height="224" fill="url(#s2-paper)" />

    <!-- Left full-height acoustic binding spine (strictly clipped inside sheet) -->
    <rect x="62" y="16" width="26" height="224" fill="url(#s2-spine)" />
    <line x1="88" y1="16" x2="88" y2="240" stroke="#18181B" stroke-width="2" opacity="0.10" />

    <!-- Subtle top-right fold cast shadow (strictly inside sheet, ends at y=70) -->
    <path d="M 188 60 H 232 V 70 Z" fill="#18181B" opacity="0.09" />

    <!-- Top-right folded corner fill -->
    <path d="M 188 16 V 55 A 5 5 0 0 0 193 60 H 232 Z" fill="#E3DED2" />

    <!-- Layer 2: Minimalist staggered TextGrid segmentation tiers (strictly inside safe zone x:106..212, y:77..131) -->
    <!-- Tier 1 -->
    <rect x="106" y="82" width="38" height="18" fill="#DDD8CC" />
    <rect x="144" y="82" width="68" height="18" fill="#2563EB" />
    <line x1="144" y1="77" x2="144" y2="105" stroke="#18181B" stroke-width="4" />

    <!-- Tier 2 -->
    <rect x="106" y="108" width="68" height="18" fill="#DDD8CC" />
    <rect x="174" y="108" width="38" height="18" fill="#7C3AED" />
    <line x1="174" y1="103" x2="174" y2="131" stroke="#18181B" stroke-width="4" />
  </g>

  <!-- Layer 3: Unified crisp linework (inner fold L-crease + single outer sheet border, zero double-stroke) -->
  <path d="M 188 16 V 55 A 5 5 0 0 0 193 60 H 232"
        fill="none" stroke="#45423B" stroke-width="5" stroke-linejoin="round" />
  <path d="M 67 16 H 188 L 232 60 V 235 A 5 5 0 0 1 227 240 H 67 A 5 5 0 0 1 62 235 V 21 A 5 5 0 0 1 67 16 Z"
        fill="none" stroke="#45423B" stroke-width="5.5" stroke-linejoin="round" />

  <!-- Layer 4 (Topmost): Oversized protruding TG index plate -->
  <g filter="url(#s2-badge-shadow)">
    <rect x="18" y="144" width="134" height="76" rx="4" fill="#2563EB" stroke="#1E3A8A" stroke-width="3" />
    <!-- Bold geometric TG vector lettering (centered optically) -->
    <g transform="translate(40.4, 157.5) scale(1.22)" fill="none" stroke="#FFFFFF" stroke-width="8.2" stroke-linecap="butt" stroke-linejoin="miter">
      <path d="M 1 4 H 31 M 16 4 V 40" />
      <path d="M 66.5 8.7 A 10 10 0 0 0 58 4 H 52 A 10 10 0 0 0 42 14 V 26 A 10 10 0 0 0 52 36 H 58 A 10 10 0 0 0 68 26 V 21.5 H 54.5" />
    </g>
  </g>
</svg>
