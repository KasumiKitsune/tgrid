[workspace]
resolver = "2"
members = [
    "crates/tg-core",
    "crates/tg-dsp",
    "crates/tg-wasm",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["TextGrid Editor Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
tg-core = { path = "crates/tg-core" }
tg-dsp = { path = "crates/tg-dsp" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false
